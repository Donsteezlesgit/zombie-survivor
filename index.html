<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#15110e"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Zombies"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" type="image/png" href="icon-192.png"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Zombie Survivor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Special+Elite&display=swap">
<style>
/* Layout: full-screen top-down night scene. HUD pinned top (health, wave, pause, stats, perk timers), ammo/swap button bottom-right, floating thumb stick. Between waves a full-screen shop with three tabs. Single dark look by choice. */
:root {
  --ground: #15110e;
  --ash: #2b2520;
  --blood: #9a1c1c;
  --bone: #ebe3d4;
  --sick: #7f9669;
  --rust: #d2692a;
  --gold: #f2c14e;
  --steel: #78b0ff;
  --dim: #9b9086;
  --face-display: "Special Elite", Georgia, "Times New Roman", serif;
  --face-ui: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
html { position: fixed; inset: 0; width: 100%; }
body {
  margin: 0;
  background: var(--ground);
  color: var(--bone);
  font-family: var(--face-ui);
  overflow: hidden;
  overscroll-behavior: none;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
}
.game { position: fixed; left: 0; top: 0; right: 0; bottom: 0; overflow: hidden; background: var(--ground); }
#c { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

.hud { position: absolute; left: 0; right: 0; top: 0; padding: calc(env(safe-area-inset-top, 0px) + 10px) max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 6px; pointer-events: none; }
.row { display: flex; align-items: center; gap: 12px; min-width: 0; }
.hp { position: relative; flex: 1; min-width: 0; height: 24px; background: rgba(0, 0, 0, 0.6); border: 1px solid #4a3f38; overflow: hidden; }
.hpfill { position: absolute; inset: 0 auto 0 0; width: 100%; background: var(--blood); transition: width 0.12s linear; }
.hptxt { position: relative; display: block; text-align: center; font: 600 16px/22px var(--face-ui); letter-spacing: 0.1em; text-shadow: 0 1px 2px #000; }
.wave { flex-shrink: 0; text-align: right; font: 700 24px/1 var(--face-ui); letter-spacing: 0.08em; text-transform: uppercase; text-shadow: 0 1px 3px #000; }
.wave small { display: block; margin-top: 2px; font: 600 14px/1 var(--face-ui); color: var(--dim); letter-spacing: 0.1em; }
.pause {
  pointer-events: auto; flex-shrink: 0;
  width: 44px; height: 44px; padding: 0;
  background: rgba(0, 0, 0, 0.55); color: var(--bone);
  border: 1px solid #4a3f38; border-radius: 4px;
  font: 700 18px/1 var(--face-ui); letter-spacing: 0.1em; cursor: pointer;
}
.stats { font: 600 15px/1 var(--face-ui); letter-spacing: 0.12em; text-transform: uppercase; color: var(--dim); text-shadow: 0 1px 3px #000; }
.stats b { color: var(--bone); font-weight: 700; }
.stats b.gold { color: var(--gold); }
.shopbtn { width: auto; min-width: 56px; padding: 0 10px; font-size: 15px; text-transform: uppercase; color: var(--gold); border-color: #6a5a30; }
.perks { display: flex; flex-wrap: wrap; gap: 6px; min-height: 0; }
.perk { padding: 3px 8px; border: 1px solid currentColor; border-radius: 3px; background: rgba(0, 0, 0, 0.6); font: 700 14px/1.1 var(--face-ui); letter-spacing: 0.08em; text-transform: uppercase; text-shadow: 0 1px 2px #000; }

:root { --rw: 104px; }
.rcol { position: absolute; right: max(16px, env(safe-area-inset-right, 0px)); top: calc(env(safe-area-inset-top, 0px) + 68px); width: var(--rw); display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; }
.mm { display: block; width: var(--rw); height: var(--rw); border-radius: 50%; border: 1px solid #5a4d44; background: rgba(0, 0, 0, 0.5); }
.swap {
  box-sizing: border-box; width: var(--rw); padding: 7px 8px 8px;
  background: rgba(0, 0, 0, 0.55); color: var(--bone);
  border: 1px solid #5a4d44; border-radius: 10px;
  font: 700 15px/1.1 var(--face-ui); letter-spacing: 0.05em; text-transform: uppercase; text-align: center;
}
.swap span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.swap small { display: block; margin-top: 4px; font: 600 15px/1 var(--face-ui); color: var(--dim); letter-spacing: 0.06em; font-variant-numeric: tabular-nums; }
.swap.special { border-color: var(--rust); }
.swap.special small { color: var(--rust); }
.swap.warn small { color: var(--gold); }
.swap.dry { border-color: var(--blood); }
.swap.dry small { color: #e0614f; }
.swapgo { position: absolute; right: max(8px, env(safe-area-inset-right, 0px)); top: 54%; width: 50px; height: 50px; padding: 0; border-radius: 50%; background: rgba(0, 0, 0, 0.55); color: var(--bone); border: 1px solid #5a4d44; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.swapgo b { font: 400 26px/1 var(--face-ui); letter-spacing: 0; margin-top: -2px; }
.swapgo:active { background: var(--rust); color: #1a0e08; border-color: var(--rust); }
.boxbtn { position: absolute; right: 16px; bottom: 16px; min-height: 48px; padding: 8px 14px; background: var(--gold); color: #1a0e08; border: 0; border-radius: 6px; font: 700 16px/1.1 var(--face-ui); letter-spacing: 0.08em; text-transform: uppercase; cursor: pointer; }
.stats, .perks, .team { max-width: calc(100% - 118px); }
@media (max-height: 520px) {
  .hud { padding-top: calc(env(safe-area-inset-top, 0px) + 6px); gap: 3px; }
  .row { gap: 8px; }
  .hp { height: 18px; }
  .hptxt { font-size: 13px; line-height: 16px; }
  .wave { font-size: 18px; }
  .wave small { font-size: 12px; margin-top: 1px; }
  .pause { width: 38px; height: 38px; font-size: 15px; }
  .shopbtn { min-width: 50px; font-size: 13px; }
  .stats { font-size: 12px; }
  .perk { font-size: 12px; padding: 2px 6px; }
  :root { --rw: 88px; }
  .rcol { top: calc(env(safe-area-inset-top, 0px) + 50px); gap: 6px; }
  .swap { padding: 5px 6px 6px; font-size: 13px; }
  .swap small { margin-top: 3px; font-size: 14px; }
  .swapgo { width: 42px; height: 42px; top: 58%; }
  .swapgo b { font-size: 21px; }
  .swap small { font-size: 13px; margin-top: 2px; }
  .boxbtn { bottom: 12px; min-height: 40px; padding: 6px 12px; font-size: 14px; }
}
}
.boxbtn:disabled { opacity: 0.45; cursor: default; }
.boxui { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(10, 8, 7, 0.9); }
.boxcard { width: min(100%, 360px); padding: 18px; background: rgba(43, 37, 32, 0.95); border: 1px solid var(--gold); border-radius: 6px; display: flex; flex-direction: column; gap: 10px; }
.boxcard h2 { margin: 0; font: 400 28px/1.05 var(--face-display); }
.boxcard .bn { font: 700 26px/1.1 var(--face-ui); letter-spacing: 0.04em; }
.boxcard .bn .lv, .boxcard .bn .cls { font: 600 13px/1 var(--face-ui); letter-spacing: 0.12em; margin-left: 8px; text-transform: uppercase; color: var(--dim); }
.boxcard .bd { font: 500 16px/1.3 var(--face-ui); color: var(--dim); font-variant-numeric: tabular-nums; }
.boxcard .bacts { display: flex; flex-direction: column; gap: 8px; margin-top: 4px; }
.boxcard .bacts .buy { width: 100%; }

.banner { position: absolute; left: 16px; right: 16px; top: 24%; text-align: center; pointer-events: none; animation: rise 0.45s ease-out both; }
.banner h2 { margin: 0; font: 400 44px/1.05 var(--face-display); letter-spacing: 0.02em; text-wrap: balance; text-shadow: 0 2px 10px #000; }
.banner p { margin: 8px auto 0; max-width: 30ch; font: 600 17px/1.3 var(--face-ui); letter-spacing: 0.08em; text-transform: uppercase; color: var(--rust); text-shadow: 0 1px 4px #000; text-wrap: balance; }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

.overlay {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 14px; padding: 24px 16px; text-align: center;
  background: rgba(10, 8, 7, 0.74);
}
.overlay h1 { margin: 0; font: 400 52px/1 var(--face-display); text-wrap: balance; text-shadow: 0 2px 12px #000; }
.overlay p { margin: 0; max-width: 28ch; font: 500 19px/1.35 var(--face-ui); color: var(--dim); text-wrap: balance; }
.overlay p b { color: var(--bone); font-weight: 700; }
.go {
  font: 700 20px/1 var(--face-ui); letter-spacing: 0.14em; text-transform: uppercase;
  color: #1a0e08; background: var(--rust);
  border: 0; border-radius: 4px; min-height: 54px; padding-inline: 34px; cursor: pointer;
}
.go.alt { background: transparent; color: var(--bone); border: 1px solid #5a4d44; font-size: 16px; min-height: 48px; }
.go[hidden] { display: none; }
.chip {
  font: 600 15px/1 var(--face-ui); letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--bone); background: transparent;
  border: 1px solid #5a4d44; border-radius: 4px; min-height: 44px; padding-inline: 18px; cursor: pointer;
}
.go:focus-visible, .chip:focus-visible, .pause:focus-visible, .swap:focus-visible, .buy:focus-visible, .tab:focus-visible { outline: 2px solid var(--bone); outline-offset: 2px; }

/* menus */
.overlay { overflow-y: auto; justify-content: flex-start; overscroll-behavior: contain; }
.overlay::before, .overlay::after { content: ''; margin: auto; }
.overlay > * { flex-shrink: 0; }
.field { width: min(280px, 100%); min-height: 48px; padding: 0 14px; font: 600 20px/1 var(--face-ui); letter-spacing: 0.06em; color: var(--bone); background: rgba(0, 0, 0, 0.5); border: 1px solid #5a4d44; border-radius: 4px; text-align: center; -webkit-user-select: text; user-select: text; box-sizing: border-box; }
.field.code { font-size: 34px; letter-spacing: 0.4em; text-transform: uppercase; min-height: 64px; padding-left: 0.4em; }
.lab { font: 700 13px/1 var(--face-ui); letter-spacing: 0.18em; text-transform: uppercase; color: var(--dim); }
.sws { display: grid; grid-template-columns: repeat(4, 44px); gap: 10px; }
.sw { width: 44px; height: 44px; border-radius: 50%; border: 2px solid #000; padding: 0; cursor: pointer; }
.sw[aria-pressed="true"] { border-color: var(--bone); box-shadow: 0 0 0 2px #000 inset; }
.hats { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.chip[aria-pressed="true"] { background: var(--rust); border-color: var(--rust); color: #1a0e08; }
.go:disabled { opacity: 0.4; cursor: default; }
.bigcode { font: 400 64px/1 var(--face-display); letter-spacing: 0.12em; padding-left: 0.12em; }
.roster { width: min(280px, 100%); display: flex; flex-direction: column; gap: 6px; }
.rrow { display: flex; align-items: center; gap: 10px; padding: 8px 12px; background: rgba(0, 0, 0, 0.45); border: 1px solid #3a322d; border-radius: 4px; font: 700 18px/1 var(--face-ui); text-align: left; }
.rrow span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rrow small { color: var(--dim); font: 600 13px/1 var(--face-ui); letter-spacing: 0.1em; text-transform: uppercase; }
.dot { width: 14px; height: 14px; border-radius: 50%; flex-shrink: 0; }
.msg { min-height: 1.2em; font: 600 15px/1.3 var(--face-ui); color: var(--rust); max-width: 30ch; }
#prev { width: 120px; height: 120px; }
.team { display: flex; flex-direction: column; gap: 3px; max-width: 160px; margin-top: 2px; }
.tm { display: flex; align-items: center; gap: 6px; font: 700 13px/1 var(--face-ui); letter-spacing: 0.08em; text-transform: uppercase; text-shadow: 0 1px 2px #000; }
.tmbar { flex: 1; height: 5px; min-width: 40px; background: rgba(0, 0, 0, 0.6); }
.tmbar i { display: block; height: 100%; background: currentColor; }

.overlay > .go, .overlay > .chip { width: min(240px, 100%); padding-inline: 0; }
.slides { display: flex; width: min(300px, 100%); overflow-x: auto; scroll-snap-type: x mandatory; touch-action: pan-x; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
.slides::-webkit-scrollbar { display: none; }
.slide { flex: 0 0 100%; scroll-snap-align: center; display: flex; flex-direction: column; align-items: center; gap: 10px; }
.slide canvas { width: 280px; height: 150px; max-width: 100%; border: 1px solid #3a322d; border-radius: 4px; }
.slide h2 { margin: 0; font: 400 30px/1 var(--face-display); }
.slide p { min-height: 5.4em; }
.bul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; text-align: left; width: min(290px, 100%); }
.bul li { position: relative; padding-left: 14px; font: 500 16px/1.3 var(--face-ui); color: var(--dim); }
.bul li::before { content: ''; position: absolute; left: 0; top: 0.55em; width: 6px; height: 6px; background: var(--rust); border-radius: 50%; }
.dots { display: flex; gap: 7px; }
.dots i { width: 8px; height: 8px; border-radius: 50%; background: #4a3f38; }
.dots i.on { background: var(--rust); }
.swipe { font: 600 13px/1 var(--face-ui); letter-spacing: 0.14em; text-transform: uppercase; color: var(--dim); }

/* shop */
.shop { position: absolute; inset: 0; display: flex; flex-direction: column; gap: 10px; padding: 14px 16px 14px; background: rgba(10, 8, 7, 0.95); min-height: 0; }
.shead { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; min-width: 0; }
.shead h2 { margin: 0; font: 400 30px/1.05 var(--face-display); text-wrap: balance; min-width: 0; }
.purse { flex-shrink: 0; text-align: right; font: 700 32px/1 var(--face-ui); color: var(--gold); letter-spacing: 0.04em; font-variant-numeric: tabular-nums; }
.purse small { display: block; margin-top: 3px; font: 600 13px/1 var(--face-ui); color: var(--dim); letter-spacing: 0.14em; text-transform: uppercase; }
.sstats { font: 600 14px/1.3 var(--face-ui); letter-spacing: 0.1em; text-transform: uppercase; color: var(--dim); }
.tabs { display: flex; gap: 8px; }
.tab {
  flex: 1; min-height: 44px; padding-inline: 4px; font: 700 15px/1 var(--face-ui); letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--bone); background: transparent; border: 1px solid #5a4d44; border-radius: 4px; cursor: pointer;
}
.tab[aria-selected="true"] { background: var(--rust); border-color: var(--rust); color: #1a0e08; }
.panel { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; touch-action: pan-y; display: flex; flex-direction: column; gap: 10px; padding-bottom: 4px; }
.sec { margin-top: 6px; font: 700 14px/1 var(--face-ui); letter-spacing: 0.18em; text-transform: uppercase; color: var(--dim); }
.card { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 12px; background: rgba(43, 37, 32, 0.75); border: 1px solid #4a3f38; border-radius: 4px; min-width: 0; flex-shrink: 0; }
.card .t { min-width: 0; }
.card .n { font: 700 20px/1.1 var(--face-ui); letter-spacing: 0.04em; }
.card .d { margin-top: 2px; font: 500 15px/1.25 var(--face-ui); color: var(--dim); font-variant-numeric: tabular-nums; }
.card .lv { font: 600 13px/1 var(--face-ui); color: var(--rust); letter-spacing: 0.1em; margin-left: 6px; }
.card .cls { font: 600 12px/1 var(--face-ui); color: var(--dim); letter-spacing: 0.14em; text-transform: uppercase; margin-left: 8px; }
.buy {
  flex-shrink: 0; min-width: 88px; min-height: 44px; padding-inline: 12px;
  font: 700 17px/1 var(--face-ui); letter-spacing: 0.06em; text-transform: uppercase;
  color: #1a0e08; background: var(--gold); border: 0; border-radius: 4px; cursor: pointer; font-variant-numeric: tabular-nums;
}
.buy.alt { background: transparent; color: var(--bone); border: 1px solid #5a4d44; }
.buy:disabled { opacity: 0.38; cursor: default; }
.coin { display: inline-block; width: 10px; height: 10px; margin-right: 6px; border-radius: 50%; background: #8a5d10; box-shadow: inset 0 0 0 2px #1a0e08; vertical-align: -1px; }
.tier0 { color: var(--dim); } .tier1 { color: var(--bone); } .tier2 { color: var(--sick); } .tier3 { color: var(--steel); } .tier4 { color: var(--rust); }
.warn { padding: 10px 12px; border: 1px solid var(--rust); border-radius: 4px; font: 500 15px/1.3 var(--face-ui); color: var(--bone); flex-shrink: 0; }
.warn .acts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.note { font: 500 15px/1.3 var(--face-ui); color: var(--dim); flex-shrink: 0; }
[hidden] { display: none !important; }
@media (prefers-reduced-motion: reduce) { .banner { animation: none; } .hpfill { transition: none; } }
@media (max-height: 520px) {
  .overlay { gap: 8px; padding: 12px 16px; }
  .overlay h1 { font-size: 34px; }
  .overlay p { font-size: 16px; max-width: 54ch; }
  .go { min-height: 44px; }
  .go.alt { min-height: 40px; }
  .slides { width: min(560px, 100%); }
  .slide { gap: 6px; }
  .slide h2 { font-size: 24px; }
  .slide p { min-height: 4em; }
  .slide canvas { height: 118px; width: 220px; }
  .shop { padding: 8px 16px; gap: 6px; }
  .shead h2 { font-size: 24px; }
  .sstats { font-size: 12px; }
  .card { padding: 6px 10px; }
  .card .n { font-size: 18px; }
  .card .d { font-size: 14px; }
}
/* main menu */
.inmenu .hud, .inmenu .rcol, .inmenu .swapgo { visibility: hidden; }
textarea.bk { width: min(340px, 100%); box-sizing: border-box; padding: 10px 12px; font: 600 12px/1.4 ui-monospace, Menlo, monospace; color: var(--bone); background: rgba(0, 0, 0, 0.5); border: 1px solid #5a4d44; border-radius: 6px; word-break: break-all; resize: none; -webkit-user-select: text; user-select: text; }
pre.diag { margin: 0; padding: 10px 12px; width: min(340px, 100%); box-sizing: border-box; text-align: left; font: 600 14px/1.5 ui-monospace, Menlo, monospace; color: var(--bone); background: rgba(0, 0, 0, 0.5); border: 1px solid #3a322d; border-radius: 6px; white-space: pre-wrap; }
.game.diagon::before { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 14px; background: #f0f; pointer-events: none; z-index: 98; }
.exps { display: flex; gap: 8px; }
.game.diagon::after { content: ''; position: absolute; left: 0; right: 0; top: 0; bottom: 0; border: 3px solid #3f3; pointer-events: none; z-index: 98; }
.overlay:has(.mhome)::before { flex: 0 0 7vh; margin: 0; }
.overlay:has(.mhome)::after { flex: 1 1 0; margin: 0; }
.mhome { width: min(300px, 100%); display: flex; flex-direction: column; align-items: stretch; gap: 10px; }
.mtitle h1 { font-size: 58px; line-height: 1.02; }
.mbest { padding: 10px 14px 12px; border: 1px solid #3a322d; border-radius: 6px; background: rgba(0, 0, 0, 0.35); margin: 6px 0 10px; }
.mrow { display: flex; justify-content: space-around; gap: 12px; margin-top: 8px; }
.mrow b { display: block; font: 700 30px/1 var(--face-ui); letter-spacing: 0.04em; color: var(--bone); font-variant-numeric: tabular-nums; }
.mrow small { display: block; margin-top: 4px; font: 600 12px/1 var(--face-ui); letter-spacing: 0.14em; text-transform: uppercase; color: var(--dim); }
.mrow .mapn { margin-top: 3px; font-size: 10px; letter-spacing: 0.08em; color: #8a7d70; }
.maps { display: flex; flex-direction: column; gap: 10px; width: 100%; margin: 6px 0 10px; }
.mapcard { display: flex; flex-direction: column; gap: 4px; text-align: left; padding: 12px 14px; border: 1px solid #3a322d; border-radius: 6px; background: rgba(0, 0, 0, 0.35); color: var(--bone); font: inherit; cursor: pointer; }
.mapcard b { font: 700 20px/1.1 var(--face-ui); letter-spacing: 0.06em; text-transform: uppercase; }
.mapcard span { font-size: 13px; color: var(--dim); }
.mapcard em { font: 600 12px/1.2 var(--face-ui); letter-spacing: 0.1em; text-transform: uppercase; color: #d2692a; font-style: normal; }
.mapcard:disabled { opacity: 0.5; cursor: default; }
.mplay, .mmore { display: flex; flex-direction: column; gap: 10px; }
.mme { margin-top: 8px; }
.mmore { margin-top: 8px; }
.mhome .go { width: 100%; padding-inline: 0; }
.mhome .msg { text-align: center; }
@media (max-height: 520px) {
  .overlay:has(.mhome)::before { flex: 1 1 0; margin: 0; }
  .mhome { width: min(780px, 100%); display: grid; grid-template-columns: 1fr 1fr; grid-template-areas: "title best" "play more" "me more"; column-gap: 36px; row-gap: 8px; align-items: start; }
  .mtitle { grid-area: title; align-self: center; text-align: left; }
  .mtitle h1 { font-size: 60px; text-align: left; line-height: 1; }
  .mbest { grid-area: best; align-self: center; margin: 0; }
  .mplay { grid-area: play; gap: 8px; }

  }

  function updateFx(dt) {
    var i;
    for (i = parts.length - 1; i >= 0; i--) {
      var p = parts[i];
      p.x += p.vx * dt; p.y += p.vy * dt;
      var pd = Math.pow(0.04, dt); p.vx *= pd; p.vy *= pd;
      p.life -= dt;
      if (p.life <= 0) { if (Math.random() < 0.3) { bloodL.x.fillStyle = 'rgba(95,10,10,0.5)'; bloodL.x.fillRect(p.x, p.y, p.r, p.r); } parts.splice(i, 1); }
    }
    for (i = fx.length - 1; i >= 0; i--) {
      var f = fx[i];
      f.x += f.vx * dt; f.y += f.vy * dt;
      var fd = Math.pow(0.05, dt); f.vx *= fd; f.vy *= fd;
      f.life -= dt;

    for (i = bolts.length - 1; i >= 0; i--) { bolts[i].life -= dt; if (bolts[i].life <= 0) bolts.splice(i, 1); }
  }

  // timers that only affect this screen
  function tickVisuals(dt) {
    time += dt;
    if (killSnd > 0) killSnd -= dt;
    if (coinSnd > 0) coinSnd -= dt;
    if (hurtFlash > 0) hurtFlash -= dt;
    shake = Math.max(0, shake - dt * 22);
    if (bannerTimer > 0) { bannerTimer -= dt; if (bannerTimer <= 0) banner.hidden = true; }
  }

  // host (or offline) world step
  function update(dt) {
    var i, j, z, P, T;
    for (i = 0; i < players.length; i++) updatePlayer(players[i], dt);

    // waves
    if (phase === 'spawning') {
      spawnTimer -= dt;
      var cap = TUNE.cap + TUNE.coopCap * (Math.max(1, players.length) - 1);
      if (queue.length && spawnTimer <= 0 && zombies.length < cap) {
        if (spawnZombie(queue[0])) { queue.shift(); spawnTimer = Math.max(0.22, 0.85 - wave * 0.04); }
        else spawnTimer = 0.5;
      }
      if (!queue.length && zombies.length === 0) waveCleared();
    } else if (phase === 'grace') {
      // short breather between waves; opening the shop pauses this countdown when playing offline
      graceT -= dt;
      if (graceT <= 0) startWave(wave + 1);
    }

    if (navOn) {
      updateDoors(dt);
      navT -= dt;
      if (navT <= 0) { navT = 0.3; navUpdate(); }
    }
    // zombies
    var gooQ = [];
    for (i = 0; i < zombies.length; i++) {
      z = zombies[i];
      if (DEV.on && DEV.zfreeze) { z.vx = z.vy = 0; continue; }
      T = nearestAlive(z.x, z.y) || players[0];
      var pdx = T.x - z.x, pdy = T.y - z.y, pdist = Math.hypot(pdx, pdy) || 1;
      var pi = pocketOf(z), bar = null, tx = T.x, ty = T.y;
      z.pocket = pi;
      if (pi >= 0 && BLD[pi].bar.planks > 0) { bar = BLD[pi].bar; tx = bar.cx; ty = bar.cy; }
      if (navOn && !bar) {
        z.navT = (z.navT || 0) - dt;
        if (z.navT <= 0) { z.navT = 0.12 + Math.random() * 0.08; z.nvOk = navSteer(z, T, navOut); z.nvx = navOut.x; z.nvy = navOut.y; z.nvWay = navOut.way; }
        if (z.nvOk) { tx = z.nvx; ty = z.nvy; }
      }

            if (z.dash <= 0) { z.rest = 1.3; z.next = z.t + 4.5; }
          } else if (z.warn > 0) {
            z.warn -= dt; mv = 0;
            if (z.warn > 0.4) z.dashA = Math.atan2(pdy, pdx);
            if (z.warn <= 0) { z.dash = 0.9; stone(160, 320, 0.25, 'sawtooth', 0.07); }
          } else if (z.rest > 0) {

            z.next = z.t + TUNE.throwGap;
            var ta = Math.atan2(pdy, pdx), nr = wave >= 20 ? 3 : (wave >= 10 ? 2 : 1), kk;
            for (kk = 0; kk < nr; kk++) {
              var rid = zid++;
              var ra = ta + (kk - (nr - 1) / 2) * 0.22;
              ebullets.push({ x: z.x + Math.cos(ra) * z.r, y: z.y + Math.sin(ra) * z.r, dx: Math.cos(ra), dy: Math.sin(ra), spd: 250, dmg: z.dmg * 0.8, r: 8, life: 2.4, spin: 0, rock: true, id: rid, shape: rockShape(rid) });
            }

          }
        } else if (z.kind === 'fire') {

            pyroFx(z);
            if (z.tick <= 0) {

              for (j = 0; j < players.length; j++) {
                P = players[j]; if (P.down) continue;
                var pa = Math.atan2(P.y - z.y, P.x - z.x), da = Math.abs(Math.atan2(Math.sin(z.ang - pa), Math.cos(z.ang - pa)));
                if (Math.hypot(P.x - z.x, P.y - z.y) < TUNE.fireRange && da < TUNE.fireCone) hurtPlayer(P, z.dmg * 0.3);

            }
            if (z.breath <= 0) z.next = z.t + 3.2;
            if (shotN % 4 === 0) snoise(0.06, 1500, 0.05);
          } else if (pdist < TUNE.fireRange + 10 && z.t > z.next) { z.breath = 1.5; z.tick = 0.05; stone(120, 70, 0.4, 'sawtooth', 0.08); }

      }

      if (wh && !bar && !wh.door) {

      }

        bar.acc += z.dmg * 0.4 * dt;
        if (bar.acc >= 10) { bar.acc -= 10; bar.planks--; snoise(0.1, 900, 0.07); stone(140, 80, 0.1, 'square', 0.05); addFx(bar.cx, bar.cy, 5, 90, 0.3, 2.5, '170,120,70'); }
      }
      if (z.flash > 0) z.flash -= dt;
      if (z.stick > 0) z.stick -= dt;
      z.atk -= dt;
      if (z.atk <= 0) {
        for (j = 0; j < players.length; j++) {
          P = players[j];
          if (!P.down && Math.hypot(P.x - z.x, P.y - z.y) <= z.r + PR + 3) { hurtPlayer(P, z.dmg); z.atk = z.cd; break; }
        }
      }
      if (z.atk < -1) z.atk = -1;
    }
    for (i = 0; i < gooQ.length; i++) gooBurst(gooQ[i]);
    for (i = 0; i < zombies.length; i++) {
      var a = zombies[i];
      for (j = i + 1; j < zombies.length; j++) {
        var b = zombies[j], sx = b.x - a.x, sy = b.y - a.y, min = a.r + b.r - 2;

    for (i = 0; i < zombies.length; i++) {

      z.y = Math.max(WALL + z.r, Math.min(WORLD - WALL - z.r, z.y));
    }

    for (i = 0; i < BLD.length; i++) {

        }

          if (br.planks >= br.max) { stone(660, 990, 0.2, 'square', 0.06, 0.08); stone(990, 1320, 0.25, 'square', 0.05, 0.2); }
          if (rp.rebuildLeft > 0) {

            rp.rebuildLeft -= Math.min(rp.rebuildLeft, rbase); rp.wallet += rc; rp.waveCoins += rc;

    // thrown rocks
    for (i = ebullets.length - 1; i >= 0; i--) {

      }
      if (hitP) { addFx(eb.x, eb.y, 6, 120, 0.3, 3, '150,130,110'); ebullets.splice(i, 1); continue; }
      if (eb.life <= 0 || wallHit(eb.x, eb.y, eb.r * 0.6) || eb.x < WALL || eb.x > WORLD - WALL || eb.y < WALL || eb.y > WORLD - WALL) { addFx(eb.x, eb.y, 5, 100, 0.25, 3, '150,130,110'); ebullets.splice(i, 1); }
    }

      c.x = Math.max(WALL + 4, Math.min(WORLD - WALL - 4, c.x));
      c.y = Math.max(WALL + 4, Math.min(WORLD - WALL - 4, c.y));

        if (T.csnd <= 0) { ptone(T, 900, 1300, 0.05, 'square', 0.03); T.csnd = 0.05; }
      }
    }
    // pickups: walk over them

  }

    { t: 'Gun upgrades', art: 'gunup', b: ['Shop, Guns tab: upgrade any gun you own from Mk I up to Mk X.', 'Each level adds damage, and fire rate too.', 'Early levels are cheap. Levels above IV get expensive fast, and Mk X on a top gun costs a fortune.', 'The held gun shows two stripes: price colour, then upgrade level (grey, green, blue, purple, red, gold).', 'Upgrades belong to a gun. Replace the gun and you lose them.'] },
    { t: 'Armour and healing', art: 'armour', b: ['Head: cuts damage taken, up to −24%.', 'Body: adds max health, up to +100.', 'Legs: adds move speed, up to +20%.', 'Each piece has four tiers, from Hard hat or Padded vest to Riot gear. Armour is worn on your character.', 'Healing, Gear tab: Bandage (+25), Medkit (+60), Full restore. Health drops also appear from zombies, but rarely.'] },
    { t: 'Special weapons', art: 'special', b: ['Flamethrower: short range fire, hits everything in the flames.', 'Rocket launcher: slow, explodes and hurts groups.', 'Minigun: very fast fire.', 'Ray gun and Lightning gun: only from the Mystery box.', 'Bosses and tanks drop special crates. Pick one up and it becomes a fourth weapon with its own ammo. When the ammo is gone, it is gone.', 'Specials get stronger as waves rise, especially after wave 20. Crates on the floor vanish when the wave ends.'] },
    { t: 'Mystery box', art: 'box', b: ['Two boxes appear on the map each wave, in new spots every wave.', 'Stand next to one and tap the button: 120 coins for a random gun.', 'Roughly 6% of rolls are a special weapon (gold). A special from the box is kept in a normal gun slot. Cheaper guns come up more often than expensive ones.', 'You can take it, swap it for a gun you hold, or discard it.', 'Online, the game keeps running while the box screen is open. Get covered first.'] },
    { t: 'Drops and power-ups', art: 'drops', b: ['Health: rare. Restores 30.', 'Ammo: refills a little of every gun and is pulled toward you.', 'Online, a power-up goes to the whole team. Power-ups last 10 seconds: Double coins, Super speed, Rapid fire, Explosive rounds, Max ammo (instant refill) and Magnet (every coin on the map flies to you; offline only).', 'Power-up timers pause while you hold a special weapon.', 'Power-ups get rarer after wave 25, but coins keep growing.', 'During a wave, drops vanish if left too long and blink before they go. After a wave they stay until picked up.'] },
    { t: 'Barriers and the map', art: 'bar', b: ['Four buildings spawn the zombies. Each has a barrier of 5 planks.', 'Zombies smash a plank at a time. When it is gone they pour out.', 'Stand next to a broken barrier to rebuild it. It earns a few coins, with a limit per wave.', 'Barriers stay damaged between waves. Only a new game resets them.', 'Buildings block walking but not bullets, which funnels zombies at you.', 'The minimap bottom-left shows zombies in red, boxes in gold, barriers as red blocks and teammates as coloured dots.'] },
    { t: 'Haunted House', art: 'haunted', b: ['A second map. Unlock it offline by clearing wave 20 on Beginners Ground. Online, the host can pick it any time.', 'Zombies climb in through the four windows. Rebuild the planks like usual.', 'Rooms are joined by corridors with a door at each end. Stand next to a door for 3 seconds to open or close it.', 'Zombies can open a shut door too, but it takes them 5 seconds. Shut doors to buy time and split them up.', 'Shut doors block you, zombies and bullets.', 'Mystery boxes only appear inside the house.', 'Sometimes (about 1 wave in 4) a room glows gold as a bonus room. It is announced at the start of the wave. Kill zombies while you stand inside it for double coins and more ammo drops. They fly straight to you, no need to pick them up.'] },
    { t: 'Relics and the cauldron', art: 'relic', b: ['Haunted House only. 8 relics hide in the house, one in every room except the Great Hall.', 'Each appears on a different wave, roughly every 2 to 3 waves, and waits where it is until someone takes it.', 'Walk over a relic to carry it. One at a time. If you go down, it drops where you fell.', 'Take it to the green cauldron in the Great Hall. The cauldron shows how many relics are in.', 'Relics show as coloured gems on the minimap, and the cauldron as a green ring.'] },
    { t: 'The Ghostbuster', art: 'ghost', b: ['When all 8 relics are in the cauldron, the whole team gets the Ghostbuster as an extra gun slot.', 'It shoots green goo. Goo slows zombies down, then they burst. The burst hurts nearby zombies and covers them in goo too.', 'Infinite ammo, and it never hurts teammates.', 'Fire for 6 seconds and it overheats. It then needs 25 seconds to cool down and you drop back to your other gun.', 'Tap the round button to swap to it. The gun box shows the heat.'] },
    { t: 'Playing together', art: 'team', b: ['One player hosts and gets a 4-letter code. Up to four players join with it.', 'Everyone has their own coins, guns, armour and upgrades.', 'More players means more zombies, and tougher ones.', 'The game does not pause when anyone opens the shop. Get covered first.', 'Downed? A teammate standing next to you for 3 seconds revives you. Otherwise you come back at half health when the wave ends.', 'Game over when everyone is down. Friends can join mid-game, starting with fresh gear and some coins.', 'The host runs the game, so the host should keep the app open.'] },
    { t: 'Saving and settings', art: 'save', b: ['Offline games save on this phone after every wave. Use Continue on the Offline screen.', 'Online games do not save.', 'Your name and look are set in Your player. Name is optional and defaults to Player 1 to 4.', 'Settings has sound, controls, a game guide, Update game, and a link to share the game.', 'Update game fetches the newest version from GitHub. Check the version number in Settings.'] }

  // ---------- commands (the host runs them for every player) ----------
  function cmd(c, a, id) {
    if (net.mode === 'client') { netSend({ k: 'cmd', c: c, a: a, id: id }); return; }
    hostCmd(me, { c: c, a: a, id: id });
  }
  // iOS does not send a click while another finger is down, so fire these on the touch itself
  function fastTap(el, fn) {
    var last = -1e9;
    el.addEventListener('pointerdown', function (e) { if (e.pointerType === 'mouse' && e.button !== 0) return; e.preventDefault(); last = performance.now(); fn(); });
    el.addEventListener('click', function () { if (performance.now() - last < 600) return; fn(); });
  }
  fastTap(swapGo, function () { ensureAudio(); if (state === 'play' && !blocked()) cmd('swap'); });

  // ---------- shop ----------
  var shopBtn = $('shopBtn'), lastShopKey = '';
  function openShop() {
    if (state !== 'play' || screen || shopOpen || !me) return;
    shopOpen = true; joy.active = false; joy.x = joy.y = 0;
    banner.hidden = true; bannerTimer = 0;
    shopTab = 'upg';
    if (me.pendingGun) cmd('shop', 'cancel', 0);
    shopTitle.textContent = introOn ? 'Shop' : phase === 'grace' ? 'Wave ' + wave + ' cleared' : 'Shop · wave ' + wave;
    shop.hidden = false;
    lastShopKey = ''; renderShop();
    panel.scrollTop = 0;
  }
  function closeShop() { shopOpen = false; shop.hidden = true; }
  function shopKey() {
    return [Math.floor(me.wallet), me.cards.map(function (c) { return c.id + (c.bought ? 1 : 0); }).join(), me.slots.map(function (s) { return s ? s.id + s.tier : '-'; }).join(),
      me.unlocked, me.armor.head, me.armor.body, me.armor.legs, JSON.stringify(me.upg), me.pendingGun, Math.round(me.hp / 5), shopTab, me.down ? 1 : 0, phase].join('|');
  }

  function buyBtn(act, id, price, enabled, cls) {
    return '<button class="buy' + (cls ? ' ' + cls : '') + '" type="button" data-act="' + act + '" data-id="' + id + '"' + (enabled ? '' : ' disabled') + '><i class="coin"></i>' + price + '</button>';
  }
  function card(name, lv, desc, btn, col) {
    return '<div class="card"' + (col ? ' style="border-left:4px solid ' + col + '"' : '') + '><div class="t"><div class="n"' + (col ? ' style="color:' + col + '"' : '') + '>' + name + (lv || '') + '</div><div class="d">' + desc + '</div></div>' + btn + '</div>';
  }
  function doneBtn(label) { return '<button class="buy alt" type="button" disabled>' + label + '</button>'; }
  function lvTag(s) { return '<span class="lv">' + s + '</span>'; }
  function gunLine(id, tier) {
    var st = wstats(me, { id: id, tier: tier || 1 }, true), d = st.d;
    return fmt(st.dmg) + (d.pellets > 1 ? '×' + d.pellets : '') + ' dmg · ' + st.rate.toFixed(1) + '/s · ' + ammoTxt(d);
  }

  function renderShop() {
    var h = '', i, id, s, d, c, p, t, st, keep = panel.scrollTop, P = me, wallet = P.wallet;
    lastShopKey = shopKey();

    for (id in tabEls) tabEls[id].setAttribute('aria-selected', shopTab === id ? 'true' : 'false');

    if (shopTab === 'upg') {
      h += '<div class="sec">Pick any of these three</div>';
      for (i = 0; i < P.cards.length; i++) {
        c = P.cards[i]; id = c.id;
        h += card(UPG[id].name, P.upg[id] > 0 ? lvTag('Lv ' + P.upg[id]) : '', UPG[id].desc,
          c.bought ? doneBtn('Bought') : buyBtn('upg', id, upgCost(P, id), wallet >= upgCost(P, id)));
      }
    } else if (shopTab === 'guns') {
      h += '<div class="sec">Your guns</div>';
      for (i = 0; i < 3; i++) {
        if (i >= P.unlocked) continue;
        s = P.slots[i];
        if (!s) { h += card('Empty slot', '', 'Buy a gun below to fill it.', ''); continue; }
        st = wstats(P, s, true);
        h += card(WEAPONS[s.id].name, lvTag('Mk ' + ROMAN[s.tier]).replace('class="lv"', 'class="lv tier' + Math.min(4, s.tier) + '"' + (s.tier >= 4 ? ' style="color:' + tierCol(s.tier) + '"' : '')),

      if (P.pendingGun) {

    else if (a === 'spawn') devSpawn(v, 1);

    else if (a === 'give') {
      var id = ($('devGun') || {}).value; if (!id || !WEAPONS[id]) return;

      if (slot < 0) slot = P.sel < 3 ? P.sel : P.lastSel;
      P.slots[slot] = makeGun(id); setSel(P, slot);
    }
    else if (a === 'slots') { P.unlocked = 3; }
    else if (a === 'gunmax') { for (i = 0; i < 3; i++) if (P.slots[i]) P.slots[i].tier = TUNE.maxTier; }
    else if (a === 'gunup') { for (i = 0; i < 3; i++) if (P.slots[i]) P.slots[i].tier = Math.min(TUNE.maxTier, P.slots[i].tier + 1); }
    else if (a === 'ammo') { maxAmmo(P); refillAllGuns(P); }
    else if (a === 'special') equipSpecial(P, v, true);
    else if (a === 'upg') { for (k in UPG) P.upg[k] += +v; P.hp = maxHpNow(P); }
    else if (a === 'upg0') { for (k in UPG) P.upg[k] = 0; P.hp = Math.min(P.hp, maxHpNow(P)); }
    else if (a === 'armor') { for (i = 0; i < ARM_PARTS.length; i++) P.armor[ARM_PARTS[i]] = +v; P.hp = Math.min(P.hp, maxHpNow(P)); }
    else if (a === 'perk') { if (v === 'ma') maxAmmo(P); else P.perkT[v] = TUNE.perkDur * 6; }
    else if (a === 'drop') { var q = devPos(P, 50); if (v === 'special') addPickup(q.x, q.y, 'special', SPECIAL_IDS[Math.floor(Math.random() * 3)], 30); else addPickup(q.x, q.y, v, v, 30); }

    else if (a === 'gbreset') { gbInit(); pickups = pickups.filter(function (q) { return q.kind !== 'item'; }); for (i = 0; i < players.length; i++) { players[i].carry = -1; players[i].ghost = null; } }
    else if (a === 'doors') { if (DOORS.length) devDoor(true, v === 'open'); else DEV.msg = 'This map has no doors.'; }
    else if (a === 'tp') { if (mapId === 'haunted') { var cx = HH.cols[+v % 3] + HH.Rm / 2, cy = HH.cols[Math.floor(+v / 3)] + HH.Rm / 2; P.x = cx; P.y = cy; } else DEV.msg = 'Room teleport is Haunted House only.'; }
    else if (a === 'tpstart') { P.x = MAPCFG.sx; P.y = MAPCFG.sy; }
    else if (a === 'box') { placeBoxes(); }
    else if (a === 'boxhere') { var bq = devPos(P, 60); boxes = [{ x: bq.x, y: bq.y }]; }

    devRender();

  function showScreenSafe() { if (screen === 'intro') showScreen(''); }
