<style>
/* Layout: full-screen top-down night scene. HUD pinned top (health, wave, pause, stats, perk timers), ammo/swap button bottom-right, floating thumb stick. Between waves a full-screen shop with three tabs. Single dark look by choice. */
:root {
  --ground: #15110e;
  --ash: #2b2520;
  --blood: #9a1c1c;
  --bone: #ebe3d4;
  --sick: #7f9669;

html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
html { position: fixed; inset: 0; width: 100%; }

  font-family: var(--face-ui);

  touch-action: none;

  -webkit-user-select: none;

}
.game { position: fixed; left: 0; top: 0; right: 0; bottom: 0; overflow: hidden; background: var(--ground); }
#c { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

.hud { position: absolute; left: 0; right: 0; top: 0; padding: calc(env(safe-area-inset-top, 0px) + 10px) max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 6px; pointer-events: none; }
.row { display: flex; align-items: center; gap: 12px; min-width: 0; }

:root { --rw: 104px; }

.swapgo { position: absolute; right: max(8px, env(safe-area-inset-right, 0px)); top: 54%; width: 50px; height: 50px; padding: 0; border-radius: 50%; background: rgba(0, 0, 0, 0.55); color: var(--bone); border: 1px solid #5a4d44; cursor: pointer; display: flex; align-items: center; justify-content: center; }

@media (max-height: 520px) {

.overlay {

/* menus */

}

.buy {

}

.tier0 { color: var(--dim); } .tier1 { color: var(--bone); } .tier2 { color: var(--sick); } .tier3 { color: var(--steel); } .tier4 { color: var(--rust); }

textarea.bk, input.bk { width: min(340px, 100%); box-sizing: border-box; padding: 10px 12px; font: 600 16px/1.4 ui-monospace, Menlo, monospace; color: var(--bone); background: rgba(0, 0, 0, 0.5); border: 1px solid #5a4d44; border-radius: 6px; word-break: break-all; resize: none; -webkit-user-select: text; user-select: text; }

/* PvP loadout */

.lg b { font: 700 16px/1.1 var(--face-ui); letter-spacing: 0.06em; text-transform: uppercase; }
.lg small { font: 600 11px/1.2 var(--face-ui); letter-spacing: 0.08em; text-transform: uppercase; color: var(--dim); }

.mme { margin-top: 8px; }
.mmore { margin-top: 8px; }
.mhome .go { width: 100%; padding-inline: 0; }
.mhome .msg { text-align: center; }
@media (max-height: 520px) {

  .mhome { width: min(780px, 100%); display: grid; grid-template-columns: 1fr 1fr; grid-template-areas: "title best" "play more" "me more"; column-gap: 36px; row-gap: 8px; align-items: start; }

/* landscape layout (v110): tips/help side by side, maps side by side, shop with left rail */
@media (orientation: landscape) and (max-height: 520px) {
  /* How to play + start-of-game tips: picture left, words right, buttons pinned on the right */
  .overlay:has(.slides) { display: grid; grid-template-columns: minmax(0, 1fr) clamp(170px, 22vw, 260px); grid-template-rows: auto minmax(0, 1fr) auto; column-gap: 18px; row-gap: 4px; align-content: stretch; padding-top: calc(env(safe-area-inset-top, 0px) + 8px); padding-bottom: max(8px, env(safe-area-inset-bottom, 0px)); text-align: left; }
  .overlay:has(.slides) h1 { grid-column: 1 / -1; font-size: clamp(26px, 7vh, 42px); text-align: left; margin: 0; }
  .overlay:has(.slides) .slides { grid-column: 1; grid-row: 2; width: 100%; align-self: stretch; min-height: 0; }
  .overlay:has(.slides) .slide { display: grid; grid-template-columns: clamp(200px, 34vw, 440px) minmax(0, 1fr); grid-template-rows: auto auto; column-gap: 20px; row-gap: 4px; align-content: safe center; justify-items: start; text-align: left; min-height: 100%; box-sizing: border-box; overflow-y: auto; }
  .overlay:has(.slides) .slide canvas { grid-row: 1 / 3; width: 100%; height: auto; aspect-ratio: 560 / 300; align-self: center; }
  .overlay:has(.slides) .slide h2 { align-self: end; font-size: clamp(24px, 6.5vh, 40px); }
  .overlay:has(.slides) .slide p { min-height: 0; align-self: start; font-size: clamp(16px, 4.1vh, 24px); max-width: none; text-align: left; }
  .overlay:has(.slides) .bul { width: 100%; gap: 3px; align-self: start; }
  .overlay:has(.slides) .bul li { font-size: clamp(14px, 3.7vh, 21px); }
  .overlay:has(.slides) .dots { grid-column: 1; grid-row: 3; align-self: center; justify-self: start; }
  .overlay:has(.slides) .swipe { grid-column: 1; grid-row: 3; align-self: center; justify-self: end; font-size: clamp(12px, 3.2vh, 16px); }
  .overlay:has(.slides) > .go { grid-column: 2; grid-row: 2 / 4; align-self: end; width: 100%; min-height: 48px; }

  /* Map pick: cards side by side, Back stays on screen */
  .overlay:has(.maps) .maps { flex-direction: row; margin: 2px 0 4px; }
  .overlay:has(.maps) .mapcard { flex: 1; min-width: 0; }

  /* Shop: left rail (coins, tabs, Back to game), right side scrolls the list in two columns */
  .shop { display: grid; grid-template-columns: 170px minmax(0, 1fr); grid-template-rows: auto auto 1fr auto; column-gap: 16px; row-gap: 8px; }
  .shop .shead { grid-column: 1; grid-row: 1; flex-direction: column; align-items: flex-start; gap: 2px; }
  .shop .shead h2 { font-size: 22px; }
  .shop .purse { text-align: left; font-size: 26px; display: flex; align-items: baseline; gap: 8px; }
  .shop .purse small { display: inline; margin: 0; }
  .shop .sstats { grid-column: 1; grid-row: 2; font-size: 11px; letter-spacing: 0.06em; }
  .shop .tabs { grid-column: 1; grid-row: 3; flex-direction: column; align-self: start; gap: 6px; }
  .shop .tab { min-height: 40px; }
  .shop #nextBtn { grid-column: 1; grid-row: 4; min-height: 44px; font-size: 16px; padding-inline: 8px; }
  .shop .panel { grid-column: 2; grid-row: 1 / -1; display: grid; grid-template-columns: 1fr 1fr; align-content: start; gap: 8px; }
  .shop .panel > .sec, .shop .panel > .warn, .shop .panel > .note { grid-column: 1 / -1; margin-top: 2px; }
  .shop .card { padding: 6px 8px; gap: 8px; }
  .shop .card .n { font-size: 16px; }
  .shop .card .d { font-size: 13px; }
  .shop .card .buy { min-width: 64px; min-height: 40px; font-size: 15px; padding-inline: 8px; }
}
@media (orientation: landscape) and (max-height: 520px) {
  .overlay:has(.slides)::before, .overlay:has(.slides)::after { display: none; }
}
/* ===== v114 Quarantine look: stencil titles, hazard tape, amber buttons, square corners. Sizes and placement unchanged. ===== */
:root { --face-stencil: "Big Shoulders Stencil Display", "Barlow Condensed", Impact, sans-serif; --hz: repeating-linear-gradient(45deg, #f2c14e 0 14px, #15110e 14px 28px); --hzr: repeating-linear-gradient(45deg, #c42b2b 0 14px, #15110e 14px 28px); --hp: #c42b2b; }

.shop { background: rgba(17, 13, 11, 0.97); }
.purse { color: var(--gold); }
.card { background: #1c1612; border-color: #3a322d; }
.sec { display: flex; align-items: center; gap: 10px; }

  function updateFx(dt) {

  // host (or offline) world step
  function update(dt) {
    var i, j, z, P, T;
    for (i = 0; i < players.length; i++) updatePlayer(players[i], dt);
    if (pvp) { pvpTick(dt); updateBullets(dt); updateFx(dt); return; }

    // waves
    if (phase === 'spawning') {
      spawnTimer -= dt;
      var cap = TUNE.cap + TUNE.coopCap * (Math.max(1, players.length) - 1);
      if (queue.length && spawnTimer <= 0 && zombies.length < cap) {
        if (spawnZombie(queue[0])) { queue.shift(); spawnTimer = Math.max(0.22, 0.85 - wave * 0.04); }
        else spawnTimer = 0.5;
      }
      if (!queue.length && zombies.length === 0) waveCleared();
    } else if (phase === 'grace') {

      graceT -= dt;

    }

    if (navOn) {
      updateDoors(dt);
      navT -= dt;
      if (navT <= 0) { navT = 0.3; navUpdate(); }
    }
    // zombies
    var gooQ = [];
    for (i = 0; i < zombies.length; i++) {
      z = zombies[i];
      if (DEV.on && DEV.zfreeze) { z.vx = z.vy = 0; continue; }

        z.ang = Math.atan2(gy, gx);

          }

      }

      var pdx = T.x - z.x, pdy = T.y - z.y, pdist = Math.hypot(pdx, pdy) || 1;
      var pi = pocketOf(z), bar = null, tx = T.x, ty = T.y;

            if (z.warn > 0.4) z.dashA = Math.atan2(pdy, pdx);
            if (z.warn <= 0) { z.dash = 0.9; stone(160, 320, 0.25, 'sawtooth', 0.07); }
          } else if (z.rest > 0) {

          } else if (z.t > z.next && pdist < 480 && pdist > 140) {

          }
        } else if (z.kind === 'throw') {

          if (z.t > z.next && pdist < 480) {

            var ta = Math.atan2(pdy, pdx), nr = wave >= 20 ? 3 : (wave >= 10 ? 2 : 1), kk;
            for (kk = 0; kk < nr; kk++) {

            }
            stone(200, 90, 0.18, 'square', 0.06);
          }
        } else if (z.kind === 'fire') {
          if (z.breath > 0) {
            z.breath -= dt; mv = 0.12; z.tick -= dt;
            pyroFx(z);
            if (z.tick <= 0) {
              z.tick = 0.25;
              for (j = 0; j < players.length; j++) {
                P = players[j]; if (P.down) continue;
                var pa = Math.atan2(P.y - z.y, P.x - z.x), da = Math.abs(Math.atan2(Math.sin(z.ang - pa), Math.cos(z.ang - pa)));
                if (Math.hypot(P.x - z.x, P.y - z.y) < TUNE.fireRange && da < TUNE.fireCone) hurtPlayer(P, z.dmg * 0.3);
              }
            }
            if (z.breath <= 0) z.next = z.t + 3.2;
            if (shotN % 4 === 0) snoise(0.06, 1500, 0.05);
          } else if (pdist < TUNE.fireRange + 10 && z.t > z.next) { z.breath = 1.5; z.tick = 0.05; stone(120, 70, 0.4, 'sawtooth', 0.08); }
          else if (pdist < 150) mv = 0.4;

      }
      if (z.gooT > 0) { z.gooT -= dt; mv *= z.boss ? 0.55 : 0.35; }
      if (z.fuse > 0) { z.fuse -= dt; if (z.fuse <= 0) { z.fuse = 0; gooQ.push(z); } }

      var wh = collide(z);
      if (wh && z.dash > 0) { z.dash = 0; z.rest = 1.4; z.next = z.t + 4.5; shakeAt(z.x, z.y, 5); snoise(0.12, 600, 0.1); }
      if (wh && !bar && !wh.door) {

        if (z.stick <= 0 && Math.abs(tdot) > 0.15) z.side = tdot > 0 ? 1 : -1;

        z.x += tdx * z.side * z.spd * 0.8 * dt; z.y += tdy * z.side * z.spd * 0.8 * dt;
      }
      if (bar && distRect(z.x, z.y, bar) < z.r + 4) {

        if (bar.acc >= 10) { bar.acc -= 10; bar.planks--; snoise(0.1, 900, 0.07); stone(140, 80, 0.1, 'square', 0.05); addFx(bar.cx, bar.cy, 5, 90, 0.3, 2.5, '170,120,70'); }
      }
      if (z.flash > 0) z.flash -= dt;
      if (z.stick > 0) z.stick -= dt;
      z.atk -= dt;
      if (z.atk <= 0) {
        for (j = 0; j < players.length; j++) {
          P = players[j];
          if (!P.down && Math.hypot(P.x - z.x, P.y - z.y) <= z.r + PR + 3) { hurtPlayer(P, z.dmg); z.atk = z.cd; break; }
        }
      }
      if (z.atk < -1) z.atk = -1;
    }
    for (i = 0; i < gooQ.length; i++) gooBurst(gooQ[i]);
    for (i = 0; i < zombies.length; i++) {
      var a = zombies[i];
      for (j = i + 1; j < zombies.length; j++) {
        var b = zombies[j], sx = b.x - a.x, sy = b.y - a.y, min = a.r + b.r - 2;
        if (Math.abs(sx) > min || Math.abs(sy) > min) continue;

    for (i = 0; i < zombies.length; i++) {

      z.y = Math.max(WALL + z.r, Math.min(WORLD - WALL - z.r, z.y));

    }

    { t: 'Bosses', art: 'boss', b: ['Brute: slow and very heavy.', 'Sprinter: shows a red lane, locks its direction, then charges. It is dizzy for a moment afterwards, so shoot it then.', 'Thrower: keeps its distance and throws rocks. You can shoot rocks down if you are lucky.', 'Pyro: breathes a cone of fire in short range. Stay out of the cone.', 'Bosses always drop a big med kit and lots of coins. Sometimes a special weapon crate lands near you at the start of a boss wave, and bosses sometimes drop one too.', 'Later waves bring more than one boss.'] },
    { t: 'Coins', art: 'coins', b: ['Every kill drops coins. Tanks and bosses drop several.', 'Walk close and coins fly to you. The Pick-up magnet upgrade widens the range.', 'Coins and drops stay on the floor after a wave until someone grabs them.', 'Coin value goes up each wave. Coin value upgrades and the Double coins power-up boost it more.', 'Online, coins you pick up are yours alone.'] },
    { t: 'Upgrades', art: 'upgrade', b: ['Shop, Upgrades tab: three random cards each wave. Each can be bought once per wave.', 'Damage, Max health, Speed, Fire rate, Crit chance, Coin value, Pick-up magnet, Special ammo, Ammo restock (+5% ammo from every ammo pickup), Reload speed (5% faster reloads, up to 10 levels).', 'Most give +10% per level (magnet and special ammo +25%). Levels stack and the price climbs each time.', 'Crit chance: each level is +10% to deal double damage.', 'Cards are fixed per wave, so reopening the shop never rerolls them.'] },
    { t: 'Guns', art: 'rarity', b: ['Classes: Pistol, SMG, Shotgun, Rifle, Sniper and LMG, from free to 15,000 coins.', 'You start with the Glock, which has endless reserve ammo.', 'Every gun has a magazine and reserve ammo. An empty magazine reloads itself. Top up a part-empty one with the round button. Guns do not refill between waves.', 'Colour shows rarity: grey, green, blue, purple, red. Gold is for special weapons.', 'Shotguns fire many pellets at close range. Snipers hit hard and pierce through several zombies.', 'When your gun runs totally dry the game switches you to another gun with ammo.'] },
    { t: 'Gun slots', art: 'slots', b: ['You begin with two slots: the Glock and an empty one.', 'Slot 3 costs 1,500 coins.', 'Buy a gun with a free slot and it goes straight in.', 'No free slot: a pop-up asks which gun to replace, and offers a new slot if you can afford it. The replaced gun and its upgrades are lost.', 'Tap the gun box under the minimap to swap guns.'] },
    { t: 'Gun upgrades', art: 'gunup', b: ['Shop, Guns tab: upgrade any gun you own from Mk I up to Mk X.', 'Each level adds damage, and fire rate too.', 'Early levels are cheap. Levels above IV get expensive fast, and Mk X on a top gun costs a fortune.', 'The held gun shows two stripes: price colour, then upgrade level (grey, green, blue, purple, red, gold).', 'Upgrades belong to a gun. Replace the gun and you lose them.'] },
    { t: 'Armour and stim', art: 'armour', b: ['Head: cuts damage taken, up to −24%.', 'Body: adds max health, up to +100.', 'Legs: adds move speed, up to +20%.', 'Each piece has four tiers, from Hard hat or Padded vest to Riot gear. Armour is worn on your character.', 'Stim: tap the syringe button above the reload button to heal half your max health and get a short speed boost. It takes 2 minutes to recharge, and it does nothing at full health. Health drops also appear from zombies, but rarely.'] },
    { t: 'Special weapons', art: 'special', b: ['Flamethrower: short range fire, hits everything in the flames.', 'Rocket launcher: slow, explodes and hurts groups.', 'Minigun: very fast fire.', 'Ray gun and Lightning gun: very rare. They can drop from zombies or come from the Mystery box.', 'Specials are lucky finds. Tanks very rarely drop a crate, and bosses sometimes do. Pick one up and it becomes a fourth weapon with its own ammo. When the ammo is gone, it is gone.', 'Specials get stronger as waves rise, especially after wave 20. Crates on the floor vanish when the wave ends.'] },
    { t: 'Mystery box', art: 'box', b: ['Two boxes appear on the map each wave, in new spots every wave.', 'Stand next to one and tap the button: 120 coins for a random gun.', 'Roughly 6% of rolls are a special weapon (gold). A special from the box is kept in a normal gun slot, and you can only keep one at a time. Cheaper guns come up more often than expensive ones.', 'You can take it, swap it for a gun you hold, or discard it.', 'Online, the game keeps running while the box screen is open. Get covered first.'] },
    { t: 'Drops and power-ups', art: 'drops', b: ['Health: rare. Restores 30. Bosses always drop a big one that restores 50.', 'Ammo: refills a little of every gun and is pulled toward you.', 'Online, a power-up goes to the whole team. Power-ups last 10 seconds: Double coins, Super speed, Rapid fire, Explosive rounds, Max ammo (instant refill) and Magnet (every coin on the map flies to you; offline only).', 'Power-up timers pause while you hold a special weapon.', 'Power-ups get rarer after wave 20, but coins keep growing.', 'Health and ammo drops stay on the floor until the next wave starts. They blink during the break, as a warning that they are about to go.'] },
    { t: 'Barriers and the map', art: 'bar', b: ['Four buildings spawn the zombies. Each has a barrier of 5 planks.', 'Zombies smash a plank at a time. When it is gone they pour out.', 'Stand next to a broken barrier to rebuild it. It earns a few coins, with a limit per wave.', 'Barriers stay damaged between waves. Only a new game resets them.', 'Buildings block walking but not bullets, which funnels zombies at you.', 'The minimap bottom-left shows zombies in red, boxes in gold, barriers as red blocks and teammates as coloured dots.', 'Tap the minimap for a big map. The game keeps running: your left thumb still walks, and a tap on the right half of the screen (or Close) shuts it.'] },
    { t: 'The Hangar', art: 'hangar', b: ['A third map, and it is pitch dark. Unlock it offline by clearing wave 10 on Beginners Ground. Online, the host can pick it any time.', 'You only see by your torch: a beam that points where you aim. It stops at walls, containers and crates, so corners hide the dead.', 'Zombies come in through four windows, one on each wall. A dim red lamp by each window shows where. Rebuild the planks like usual.', 'Shipping containers, crates and a low-walled deck in the middle block walking and the torch. Barrels and the catwalk rails do not.', 'Mystery boxes work as normal, but you have to find them in the dark. Teammates only show as a small glow. In PvP, opponents have no glow and no nametag.', 'It is also the PvP map. Offline and online zombie games both work.'] },
    { t: 'Haunted House', art: 'haunted', b: ['A second map. Unlock it offline by clearing wave 20 on Beginners Ground. Online, the host can pick it any time.', 'Zombies climb in through the four windows. Rebuild the planks like usual.', 'Rooms are joined by corridors with a door at each end. Stand next to a door for 3 seconds to open or close it.', 'Zombies can open a shut door too, but it takes them 5 seconds. Shut doors to buy time and split them up.', 'Shut doors block you, zombies and bullets.', 'Mystery boxes only appear inside the house.', 'Sometimes (about 1 wave in 4) a room glows gold as a bonus room. It is announced at the start of the wave. Kill zombies while you stand inside it for double coins and more ammo drops. They fly straight to you, no need to pick them up.'] },
    { t: 'Ghost rounds', art: 'ghosts', b: ['Haunted House only. Every 10th wave (10, 20, 30...) is a ghost round.', 'No zombies spawn and the usual boss is skipped. Only small ghosts come.', 'Ghosts are fast and have lots of health, but barely hurt you.', 'They fly through walls and shut doors. Your bullets still stop at walls.', 'Each ghost drops a lot of coins when it dies.'] },
    { t: 'Relics and the cauldron', art: 'relic', b: ['Haunted House only. 8 relics hide in the house, one in every room except the Great Hall.', 'Each appears on a different wave, roughly every 2 to 3 waves, and waits where it is until someone takes it.', 'Walk over a relic to carry it. One at a time. If you go down, it drops where you fell.', 'Take it to the green cauldron in the Great Hall. The cauldron shows how many relics are in.', 'Relics show as coloured gems on the minimap, and the cauldron as a green ring.'] },
    { t: 'The Ghostbuster', art: 'ghost', b: ['When all 8 relics are in the cauldron, the whole team gets the Ghostbuster as an extra gun slot.', 'It shoots green goo. Goo slows zombies down, then the ones hit by goo burst. The burst hurts nearby zombies, but only zombies hit by goo burst.', 'Infinite ammo, and it never hurts teammates.', 'Fire for 6 seconds and it overheats. It then needs 25 seconds to cool down and you drop back to your other gun.', 'Tap the gun box to swap to it. The gun box shows the heat.'] },
    { t: 'Playing together', art: 'team', b: ['One player hosts and gets a 4-letter code. Up to four players join with it.', 'Everyone has their own coins, guns, armour and upgrades.', 'More players means more zombies, and tougher ones.', 'The game does not pause when anyone opens the shop. Get covered first.', 'Downed? You lose every upgrade you bought, but keep your guns and armour. A teammate standing next to you for 3 seconds revives you, and you have 20 seconds.', 'Not revived in time and you are dead: you lose everything (guns, armour, coins). You come back at the start of the next wave with a Colt Python at full ammo and 200 coins, or 1,000 coins after wave 15.', 'Game over when everyone is down or dead. Friends can join mid-game, starting with fresh gear and some coins.', 'The host runs the game, so the host should keep the app open.'] },
    { t: 'PvP mode', art: 'team', b: ['Online only. The host picks PvP on the host screen, then any map. 2 to 4 players, no zombies, everyone for themselves.', 'First to 15 kills wins. Your kills and everyone else\'s show at the top left.', 'Before the round you pick 2 guns from 6 mid-range ones (MP5, AK-47, M4A1, Python, Desert Eagle, Benelli). Seven more (SCAR-H, Vector, AUG, Val, Striker 12, AA-12, Dragunov) can be unlocked in the Armoury. You start with one magazine per gun. Ammo crates appear around the map every so often; walk over one to get a magazine for each gun (3 spare at most).', 'Stim button: tap it to get back to full health with a short speed boost. It takes a minute to recharge, and it is ready again when you respawn.', 'There is no auto aim. Hold the right thumb and point the thin line at someone: your gun fires only while another player is on the line. Let go and you stop.', 'Die and you respawn after 3 seconds, far from the others, with 2 seconds of protection. While you wait you can change your guns. Firing ends the protection.', 'Everyone has the same health. A UAV ping shows every other player on the minimap for 1.5 seconds, every 5 seconds.'] },
    { t: 'Armoury and Z-bucks', art: 'upgrade', b: ['Z-bucks are a second currency. They save on this phone and you only get them by playing.', 'Every Zombies game, offline or online: 1 Z-buck each time you pass another 10 waves (10, 20, 30...) and another for every 500 kills in that game.', 'Win a PvP match: 4 Z-bucks.', 'Daily quests: 3 new ones each day, shown on the main menu. Finish all three for 1 more. They reset at midnight.', 'The Armoury on the main menu lists every gun. Tap one to buy and fit its attachments and skins. Each gun has its own, and you can fit all of them at once.', 'Attachments: Red dot sight, Extended mag, Suppressor, Foregrip, Laser sight, Hollow points. They work in Zombies and in PvP.', 'Seven guns (SCAR-H, Vector, AUG, Val, Striker 12, AA-12, Dragunov) have a Use in PvP option on their screen. Buy it once and you can pick that gun in PvP.', 'Each gun also has bullet trails, bought and fitted the same way. Other players see your skins and trails online.'] },
    { t: 'Saving and settings', art: 'save', b: ['Offline games save on this phone after every wave. Use Continue on the Offline screen.', 'Online games do not save.', 'Your name and look are set in Your player. Name is optional and defaults to Player 1 to 4.', 'Settings has sound, controls, a game guide, Update game, and a link to share the game.', 'On menu screens, swipe right from the very left edge of the screen to go back.', 'Update game fetches the newest version from GitHub. Check the version number in Settings.'] }
  ];

      list.push({ t: 'Relics', art: 'relic', b: ['8 relics hide in the house, one in every room except the Great Hall. They show up on different waves.', 'Walk over one to pick it up. You carry one at a time, and it drops where you fall.', 'Carry it to the green cauldron in the Great Hall. Relics stay put until someone takes them.'] });
