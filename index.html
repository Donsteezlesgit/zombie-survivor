<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#15110e"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black"><meta name="apple-mobile-web-app-title" content="Zombies"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" type="image/png" href="icon-192.png"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Zombie Survivor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Special+Elite&display=swap">
<style>
/* Layout: full-screen top-down night scene. HUD pinned top (health, wave, pause, stats, perk timers), ammo/swap button bottom-right, floating thumb stick. Between waves a full-screen shop with three tabs. Single dark look by choice. */
:root {
  --ground: #15110e;
  --ash: #2b2520;
  --blood: #9a1c1c;
  --bone: #ebe3d4;
  --sick: #7f9669;
  --rust: #d2692a;
  --gold: #f2c14e;
  --steel: #78b0ff;
  --dim: #9b9086;
  --face-display: "Special Elite", Georgia, "Times New Roman", serif;
  --face-ui: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--ground);
  color: var(--bone);
  font-family: var(--face-ui);
  overflow: hidden;
  overscroll-behavior: none;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
}
.game { position: relative; height: 100%; overflow: hidden; background: var(--ground); }
#c { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

.hud { position: absolute; left: 0; right: 0; top: 0; padding: 10px 16px 0; display: flex; flex-direction: column; gap: 6px; pointer-events: none; }
.row { display: flex; align-items: center; gap: 12px; min-width: 0; }
.hp { position: relative; flex: 1; min-width: 0; height: 24px; background: rgba(0, 0, 0, 0.6); border: 1px solid #4a3f38; overflow: hidden; }
.hpfill { position: absolute; inset: 0 auto 0 0; width: 100%; background: var(--blood); transition: width 0.12s linear; }
.hptxt { position: relative; display: block; text-align: center; font: 600 16px/22px var(--face-ui); letter-spacing: 0.1em; text-shadow: 0 1px 2px #000; }
.wave { flex-shrink: 0; text-align: right; font: 700 24px/1 var(--face-ui); letter-spacing: 0.08em; text-transform: uppercase; text-shadow: 0 1px 3px #000; }
.wave small { display: block; margin-top: 2px; font: 600 14px/1 var(--face-ui); color: var(--dim); letter-spacing: 0.1em; }
.pause {
  pointer-events: auto; flex-shrink: 0;
  width: 44px; height: 44px; padding: 0;
  background: rgba(0, 0, 0, 0.55); color: var(--bone);
  border: 1px solid #4a3f38; border-radius: 4px;
  font: 700 18px/1 var(--face-ui); letter-spacing: 0.1em; cursor: pointer;
}
.stats { font: 600 15px/1 var(--face-ui); letter-spacing: 0.12em; text-transform: uppercase; color: var(--dim); text-shadow: 0 1px 3px #000; }
.stats b { color: var(--bone); font-weight: 700; }
.stats b.gold { color: var(--gold); }
.shopbtn { width: auto; min-width: 56px; padding: 0 10px; font-size: 15px; text-transform: uppercase; color: var(--gold); border-color: #6a5a30; }
.perks { display: flex; flex-wrap: wrap; gap: 6px; min-height: 0; }
.perk { padding: 3px 8px; border: 1px solid currentColor; border-radius: 3px; background: rgba(0, 0, 0, 0.6); font: 700 14px/1.1 var(--face-ui); letter-spacing: 0.08em; text-transform: uppercase; text-shadow: 0 1px 2px #000; }

.swap {
  position: absolute; right: 16px; bottom: 16px;
  min-width: 108px; min-height: 64px; padding: 8px 14px;
  background: rgba(0, 0, 0, 0.62); color: var(--bone);
  border: 1px solid #5a4d44; border-radius: 6px;
  font: 700 16px/1.15 var(--face-ui); letter-spacing: 0.06em; text-transform: uppercase; text-align: center; cursor: pointer;
}
.swap small { display: block; margin-top: 3px; font: 600 15px/1 var(--face-ui); color: var(--dim); letter-spacing: 0.08em; font-variant-numeric: tabular-nums; }
.swap.special { border-color: var(--rust); }
.swap.special small { color: var(--rust); }
.swap.warn small { color: var(--gold); }
.swap.dry { border-color: var(--blood); }
.swap.dry small { color: #e0614f; }.mm { position: absolute; left: 12px; bottom: 12px; width: 96px; height: 96px; border-radius: 50%; border: 1px solid #5a4d44; background: rgba(0, 0, 0, 0.5); pointer-events: none; }

.boxbtn { position: absolute; right: 16px; bottom: 92px; min-height: 48px; padding: 8px 14px; background: var(--gold); color: #1a0e08; border: 0; border-radius: 6px; font: 700 16px/1.1 var(--face-ui); letter-spacing: 0.08em; text-transform: uppercase; cursor: pointer; }
.boxbtn:disabled { opacity: 0.45; cursor: default; }
.boxui { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(10, 8, 7, 0.9); }
.boxcard { width: min(100%, 360px); padding: 18px; background: rgba(43, 37, 32, 0.95); border: 1px solid var(--gold); border-radius: 6px; display: flex; flex-direction: column; gap: 10px; }
.boxcard h2 { margin: 0; font: 400 28px/1.05 var(--face-display); }
.boxcard .bn { font: 700 26px/1.1 var(--face-ui); letter-spacing: 0.04em; }
.boxcard .bn .lv, .boxcard .bn .cls { font: 600 13px/1 var(--face-ui); letter-spacing: 0.12em; margin-left: 8px; text-transform: uppercase; color: var(--dim); }
.boxcard .bd { font: 500 16px/1.3 var(--face-ui); color: var(--dim); font-variant-numeric: tabular-nums; }
.boxcard .bacts { display: flex; flex-direction: column; gap: 8px; margin-top: 4px; }
.boxcard .bacts .buy { width: 100%; }

.banner { position: absolute; left: 16px; right: 16px; top: 24%; text-align: center; pointer-events: none; animation: rise 0.45s ease-out both; }
.banner h2 { margin: 0; font: 400 44px/1.05 var(--face-display); letter-spacing: 0.02em; text-wrap: balance; text-shadow: 0 2px 10px #000; }
.banner p { margin: 8px auto 0; max-width: 30ch; font: 600 17px/1.3 var(--face-ui); letter-spacing: 0.08em; text-transform: uppercase; color: var(--rust); text-shadow: 0 1px 4px #000; text-wrap: balance; }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

.overlay {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 14px; padding: 24px 16px; text-align: center;
  background: rgba(10, 8, 7, 0.74);
}
.overlay h1 { margin: 0; font: 400 52px/1 var(--face-display); text-wrap: balance; text-shadow: 0 2px 12px #000; }
.overlay p { margin: 0; max-width: 28ch; font: 500 19px/1.35 var(--face-ui); color: var(--dim); text-wrap: balance; }
.overlay p b { color: var(--bone); font-weight: 700; }
.go {
  font: 700 20px/1 var(--face-ui); letter-spacing: 0.14em; text-transform: uppercase;
  color: #1a0e08; background: var(--rust);
  border: 0; border-radius: 4px; min-height: 54px; padding-inline: 34px; cursor: pointer;
}
.go.alt { background: transparent; color: var(--bone); border: 1px solid #5a4d44; font-size: 16px; min-height: 48px; }
.go[hidden] { display: none; }
.chip {
  font: 600 15px/1 var(--face-ui); letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--bone); background: transparent;
  border: 1px solid #5a4d44; border-radius: 4px; min-height: 44px; padding-inline: 18px; cursor: pointer;
}
.go:focus-visible, .chip:focus-visible, .pause:focus-visible, .swap:focus-visible, .buy:focus-visible, .tab:focus-visible { outline: 2px solid var(--bone); outline-offset: 2px; }

/* shop */
.shop { position: absolute; inset: 0; display: flex; flex-direction: column; gap: 10px; padding: 14px 16px 14px; background: rgba(10, 8, 7, 0.95); min-height: 0; }
.shead { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; min-width: 0; }
.shead h2 { margin: 0; font: 400 30px/1.05 var(--face-display); text-wrap: balance; min-width: 0; }
.purse { flex-shrink: 0; text-align: right; font: 700 32px/1 var(--face-ui); color: var(--gold); letter-spacing: 0.04em; font-variant-numeric: tabular-nums; }
.purse small { display: block; margin-top: 3px; font: 600 13px/1 var(--face-ui); color: var(--dim); letter-spacing: 0.14em; text-transform: uppercase; }
.sstats { font: 600 14px/1.3 var(--face-ui); letter-spacing: 0.1em; text-transform: uppercase; color: var(--dim); }
.tabs { display: flex; gap: 8px; }
.tab {
  flex: 1; min-height: 44px; padding-inline: 4px; font: 700 15px/1 var(--face-ui); letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--bone); background: transparent; border: 1px solid #5a4d44; border-radius: 4px; cursor: pointer;
}
.tab[aria-selected="true"] { background: var(--rust); border-color: var(--rust); color: #1a0e08; }
.panel { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; touch-action: pan-y; display: flex; flex-direction: column; gap: 10px; padding-bottom: 4px; }
.sec { margin-top: 6px; font: 700 14px/1 var(--face-ui); letter-spacing: 0.18em; text-transform: uppercase; color: var(--dim); }
.card { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 12px; background: rgba(43, 37, 32, 0.75); border: 1px solid #4a3f38; border-radius: 4px; min-width: 0; flex-shrink: 0; }
.card .t { min-width: 0; }
.card .n { font: 700 20px/1.1 var(--face-ui); letter-spacing: 0.04em; }
.card .d { margin-top: 2px; font: 500 15px/1.25 var(--face-ui); color: var(--dim); font-variant-numeric: tabular-nums; }
.card .lv { font: 600 13px/1 var(--face-ui); color: var(--rust); letter-spacing: 0.1em; margin-left: 6px; }
.card .cls { font: 600 12px/1 var(--face-ui); color: var(--dim); letter-spacing: 0.14em; text-transform: uppercase; margin-left: 8px; }
.buy {
  flex-shrink: 0; min-width: 88px; min-height: 44px; padding-inline: 12px;
  font: 700 17px/1 var(--face-ui); letter-spacing: 0.06em; text-transform: uppercase;
  color: #1a0e08; background: var(--gold); border: 0; border-radius: 4px; cursor: pointer; font-variant-numeric: tabular-nums;
}
.buy.alt { background: transparent; color: var(--bone); border: 1px solid #5a4d44; }
.buy:disabled { opacity: 0.38; cursor: default; }
.coin { display: inline-block; width: 10px; height: 10px; margin-right: 6px; border-radius: 50%; background: #8a5d10; box-shadow: inset 0 0 0 2px #1a0e08; vertical-align: -1px; }
.tier0 { color: var(--dim); } .tier1 { color: var(--bone); } .tier2 { color: var(--sick); } .tier3 { color: var(--steel); } .tier4 { color: var(--rust); }
.warn { padding: 10px 12px; border: 1px solid var(--rust); border-radius: 4px; font: 500 15px/1.3 var(--face-ui); color: var(--bone); flex-shrink: 0; }
.warn .acts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.note { font: 500 15px/1.3 var(--face-ui); color: var(--dim); flex-shrink: 0; }
[hidden] { display: none !important; }
@media (prefers-reduced-motion: reduce) { .banner { animation: none; } .hpfill { transition: none; } }
</style>

<div class="game" id="game">
  <canvas id="c" aria-label="Top-down zombie survival arena. Drag with one thumb to move; your character shoots automatically."></canvas>
  <div class="hud">
    <div class="row">
      <div class="hp"><div class="hpfill" id="hpfill"></div><span class="hptxt" id="hptxt">100 / 100</span></div>
      <div class="wave"><span id="waveN">Wave 1</span><small id="left">6 left</small></div>
      <button class="pause shopbtn" id="shopBtn" type="button" aria-label="Open shop">Shop</button>
      <button class="pause" id="pauseBtn" type="button" aria-label="Pause">II</button>
    </div>
    <div class="stats" id="stats">Coins <b class="gold">0</b> &middot; Kills <b>0</b></div>
    <div class="perks" id="perks"></div>
  </div>
  <canvas class="mm" id="mm" width="96" height="96" aria-hidden="true"></canvas>
  <button class="swap" id="swapBtn" type="button" aria-label="Swap weapon"></button>
  <button class="boxbtn" id="boxBtn" type="button" hidden>Mystery box · 120</button>
  <div class="boxui" id="boxUI" hidden><div class="boxcard"><h2>Mystery box</h2><div id="boxBody"></div></div></div>
  <div class="banner" id="banner" hidden><h2 id="bnTitle"></h2><p id="bnText"></p></div>

  <div class="shop" id="shop" hidden>
    <div class="shead">
      <h2 id="shopTitle">Wave 1 cleared</h2>
      <div class="purse"><span id="purse">0</span><small>Coins</small></div>
    </div>
    <div class="sstats" id="sstats"></div>
    <div class="tabs" id="tabs" role="tablist">
      <button class="tab" id="tabUpg" type="button" role="tab" data-tab="upg" aria-selected="true">Upgrades</button>
      <button class="tab" id="tabGuns" type="button" role="tab" data-tab="guns" aria-selected="false">Guns</button>
      <button class="tab" id="tabGear" type="button" role="tab" data-tab="gear" aria-selected="false">Gear</button>
    </div>
    <div class="panel" id="panel"></div>
    <button class="go" id="nextBtn" type="button">Back to game</button>
  </div>

  <div class="overlay" id="ov">
    <h1 id="ovTitle">Zombie Survivor</h1>
    <p id="ovText">Drag anywhere with one thumb to move. You shoot on your own. Kill zombies for <b>coins</b>, watch your <b>ammo</b>, and spend between waves.</p>
    <button class="go" id="goBtn" type="button">Start</button>
    <button class="go alt" id="contBtn" type="button" hidden>Continue</button>
    <button class="chip" id="muteBtn" type="button">Sound on</button>
  </div>
</div>

    bossRun:   { r: 21, hp: 480, spd: 92,  dmg: 20, cd: 0.9, coins: 40, skin: '#8a5a3c', cloth: '#3a1f18', boss: 1, kind: 'run',   name: 'Sprinter boss' },
    bossThrow: { r: 26, hp: 650, spd: 55,  dmg: 24, cd: 1.2, coins: 40, skin: '#5f7080', cloth: '#222c38', boss: 1, kind: 'throw', name: 'Thrower boss' },

  };
  var BOSS_KINDS = ['boss', 'bossRun', 'bossThrow', 'bossFire'];

  // ---------- guns ----------
  // dmg = multiple of base damage per bullet/pellet. mag = rounds per magazine, res = reserve rounds, reload = seconds.
  var CLS = {

  var WEAPONS = {};
  function G(id, name, cls, price, dmg, rate, pellets, spread, range, speed, pierce, mag, res, reload) {

  }
  //   id         name              class     price  dmg   rate  pel spread range speed pierce mag  res  reload
  G('glock',   'Glock 17',        'pistol',     0, 1.0,  3.6,  1, 0.03, 400,  640, 0,  15,  Infinity, 1.1);
  G('m1911',   'Colt M1911',      'pistol',    90, 1.6,  2.8,  1, 0.03, 410,  660, 0,   7,  56, 1.2);
  G('uzi',     'Uzi',             'smg',      130, 0.5, 12,    1, 0.20, 360,  680, 0,  32, 192, 1.6);

  G('ak47',    'AK-47',           'rifle',    420, 1.5,  7.5,  1, 0.08, 420,  800, 0,  30, 180, 2.0);
  G('deagle',  'Desert Eagle',    'pistol',   440, 5.0,  1.9,  1, 0.03, 440,  820, 1,   8,  56, 1.9);

  G('m4a1',    'Colt M4A1',       'rifle',    680, 1.4,  9.5,  1, 0.05, 440,  850, 0,  30, 210, 1.7);
  G('benelli', 'Benelli M4',      'shotgun',  720, 1.0,  2.0,  8, 0.60, 250,  580, 0,   8,  48, 2.4);
  G('svd',     'Dragunov SVD',    'sniper',   780, 5.5,  2.0,  1, 0.01, 500, 1000, 2,  10,  70, 2.4);

  G('vector',  'KRISS Vector',    'smg',     1150, 0.85, 17,   1, 0.12, 400,  740, 0,  33, 231, 1.4);

  G('m82',     'Barrett M82',     'sniper',  1900, 16,   0.9,  1, 0.005, 520, 1200, 4,   5,  25, 3.2);

  var SHOP_GUNS = Object.keys(WEAPONS).filter(function (k) { return WEAPONS[k].price > 0; }).sort(function (a, b) { return WEAPONS[a].price - WEAPONS[b].price; });

  var SPECIALS = {

    BOX_SPECIALS.forEach(function (id) {

    if (old && old.reload > 0) old.reload = 0;
    if (sel !== 3) lastSel = sel;
    sel = n;
    if (n !== 3) lastSel = n;
    player.fireCd = 0.12;
  }

  function freshPlayer() {
    return { x: WORLD / 2, y: WORLD / 2, ang: -Math.PI / 2, hp: maxHpNow(), fireCd: 0, flash: 0, inv: 0, step: 0, idle: 0 };
  }
  player = freshPlayer();
  slots[0] = makeGun('glock');

  function buildQueue(w) {
    var q = [], n = 6 + 4 * (w - 1), i;
    var tankP = w >= 5 ? Math.min(0.2, 0.04 * (w - 4)) : 0;
    var runnerP = w >= 3 ? Math.min(0.35, 0.08 * (w - 2)) : 0;
    for (i = 0; i < n; i++) {
      var r = Math.random();
      q.push(r < tankP ? 'tank' : (r < tankP + runnerP ? 'runner' : 'walker'));
    }
    if (w % 5 === 0) {
      var nb = 1 + Math.floor(w / 15), b0 = (Math.floor(w / 5) - 1) % BOSS_KINDS.length;
      for (i = 0; i < nb; i++) q.splice(Math.floor(n * 0.4), 0, BOSS_KINDS[(b0 + i) % BOSS_KINDS.length]);
    }
    return q;
  }
  queue = buildQueue(1);

  function pickSpawn() {
    var idx = [0, 1, 2, 3], i, j, t, cnt = [0, 0, 0, 0], z, best = -1;
    for (i = idx.length - 1; i > 0; i--) { j = Math.floor(Math.random() * (i + 1)); t = idx[i]; idx[i] = idx[j]; idx[j] = t; }
    for (i = 0; i < zombies.length; i++) { z = zombies[i]; if (z.pocket >= 0) cnt[z.pocket]++; }
    for (i = 0; i < 4; i++) {
      j = idx[i];
      if (BLD[j].bar.planks > 0 && cnt[j] >= 5) continue;
      if (cnt[j] >= 8) continue;
      if (Math.hypot(BLD[j].sx - player.x, BLD[j].sy - player.y) < 260) { if (best < 0) best = -2 - j; continue; }
      return j;
    }
    return best <= -2 ? -2 - best : -1;
  }

  function spawnZombie(type) {
    var bi = pickSpawn();
    if (bi < 0) return false;
    var t = TYPES[type], b = BLD[bi], jit = rnd(-POCKET_HW * 0.5, POCKET_HW * 0.5);
    var x = b.sx + b.tx * jit, y = b.sy + b.ty * jit;
    var hpS = 1 + TUNE.zHpScale * (wave - 1), dS = 1 + TUNE.zDmgScale * (wave - 1);
    if (wave >= TUNE.l25.wave) { hpS *= TUNE.l25.hp; dS *= TUNE.l25.dmg; }
    zombies.push({
      x: x, y: y, type: type, r: t.r, hp: t.hp * hpS, maxhp: t.hp * hpS, boss: !!t.boss, kind: t.kind || '',
      spd: t.spd * (0.92 + Math.random() * 0.16), dmg: t.dmg * dS, cd: t.cd,
      atk: 0.4, ang: 0, flash: 0, vx: 0, vy: 0, seed: Math.random() * 10,
      skin: t.skin, cloth: t.cloth, pocket: bi, side: Math.random() < 0.5 ? 1 : -1,
      stick: 0, t: 0, next: 2 + Math.random() * 2, dash: 0, dashA: 0, rest: 0, warn: 0, breath: 0, tick: 0
    });
    if (t.boss) { tone(80, 40, 0.7, 'sawtooth', 0.09); buzz(40); showBanner(t.name, 'Watch yourself.', 1.8); }
    return true;
  }

  // mystery boxes move every wave
  function placeBoxes() {
    boxes = [];
    var n = 0, tries = 0, x, y, ok, i;
    while (n < TUNE.boxes && tries++ < 200) {
      x = rnd(WALL + 70, WORLD - WALL - 70); y = rnd(WALL + 70, WORLD - WALL - 70);
      ok = Math.hypot(x - player.x, y - player.y) > 180;
      for (i = 0; ok && i < RECTS.length; i++) if (distRect(x, y, RECTS[i]) < 50) ok = false;
      for (i = 0; ok && i < boxes.length; i++) if (Math.hypot(x - boxes[i].x, y - boxes[i].y) < 350) ok = false;
      if (ok) { boxes.push({ x: x, y: y }); n++; }
    }
  }
  function nearBox() {
    for (var i = 0; i < boxes.length; i++) if (Math.hypot(boxes[i].x - player.x, boxes[i].y - player.y) < 52) return boxes[i];
    return null;
  }

  function showBanner(title, text, secs) {
    bnTitle.textContent = title; bnText.textContent = text; bannerTimer = secs;
    banner.hidden = true; void banner.offsetWidth; banner.hidden = false;
  }

  function startWave(n) {
    wave = n; queue = buildQueue(n);
    phase = 'spawning'; spawnTimer = 1.2; waveCoins = 0;
    var boss = n % 5 === 0, bi;
    // barriers stay as they were between waves; only a new game rebuilds them
    if (n === 1) for (bi = 0; bi < BLD.length; bi++) { BLD[bi].bar.planks = BLD[bi].bar.max; BLD[bi].bar.acc = 0; BLD[bi].bar.rt = 0; }
    rebuildLeft = (30 + 8 * n) * barBonus(n); ebullets = []; bolts = [];
    placeBoxes();
    showBanner('Wave ' + n, (n === 1 ? 'Stand at a broken barrier to rebuild it.' : (boss ? 'Something big is coming.' : queue.length + ' zombies incoming.')), 2.6);
  }

  function equipSpecial(id, quiet) {
    var d = SPECIALS[id], max = Math.round(d.ammo * (1 + 0.25 * upg.sammo) * specAmmoMult());
    special = { id: id, ammo: max, max: max };
    setSel(3);
    tone(500, 900, 0.15, 'square', 0.06);
    if (!quiet) showBanner(d.name, max + ' shots. Make them count.', 1.8);
  }

  function dropSpecial() {
    var i;
    special = null;
    if (slots[lastSel] && lastSel < unlocked) { sel = lastSel; }
    else { for (i = 0; i < 3; i++) if (slots[i]) { sel = i; break; } }
    lastSel = sel;
    player.fireCd = 0.12;
  }

  function refillAllGuns() {
    for (var i = 0; i < 3; i++) if (slots[i]) refillGun(slots[i]);
  }

  function maxAmmo() {
    refillAllGuns();
    if (special) special.ammo = special.max;
    tone(400, 800, 0.12, 'square', 0.06); tone(600, 1000, 0.15, 'square', 0.06, 0.1);
    showBanner('Max ammo', 'Every gun refilled.', 1.4);
  }

  function healPlayer(n) { player.hp = Math.min(maxHpNow(), player.hp + n); tone(520, 780, 0.15, 'sine', 0.07); }

  function waveCleared() {
    var i, keep = [];
    // coins and other drops stay on the floor until you pick them up; special weapons vanish
    for (i = 0; i < pickups.length; i++) {
      if (pickups[i].kind !== 'special') { pickups[i].t = 1e9; keep.push(pickups[i]); }
    }
    pickups = keep;
    refillAllGuns();
    rollCards();
    phase = 'grace'; graceT = TUNE.grace;
    showBanner('Wave ' + wave + ' cleared', 'Next wave in ' + TUNE.grace + 's · shop is open any time', 2.6);
    tone(330, 330, 0.12, 'square', 0.06); tone(494, 494, 0.12, 'square', 0.06, 0.12); tone(659, 659, 0.2, 'square', 0.06, 0.24);
    saveGame();
  }

  function newGame() {
    wallet = 0; waveCoins = 0;
    armor.head = armor.body = armor.legs = 0;
    for (var k in upg) upg[k] = 0;
    for (var p in perkT) perkT[p] = 0;
    slots = [makeGun('glock'), null, null]; unlocked = 1; special = null; sel = 0; lastSel = 0;
    player = freshPlayer();
    zombies = []; bullets = []; parts = []; fx = []; coins = []; pickups = []; ebullets = []; bolts = [];
    kills = 0; shake = 0; hurtFlash = 0; pendingGun = null; rollCards();
    bloodL.x.clearRect(0, 0, WORLD, WORLD);
    state = 'play';
    startWave(1);
    hideOverlay(); shop.hidden = true;
  }

  // ---------- save / continue (this device only) ----------
  var SAVE_KEY = 'zs-save-v1';
  function saveGame() {
    var cw = phase === 'spawning' ? wave - 1 : wave;   // last fully cleared wave
    if (cw < 1) return;
    try {
      var data = {
        wave: cw, wallet: wallet, kills: kills, hp: player.hp, unlocked: unlocked,
        upg: upg, armor: armor,
        bar: BLD.map(function (b) { return b.bar.planks; }),
        slots: slots.map(function (g) { return g ? { id: g.id, tier: g.tier } : null; })
      };
      localStorage.setItem(SAVE_KEY, JSON.stringify(data));
    } catch (e) {}
  }
  function readSave() {
    try {
      var d = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null');
      if (!d || !(d.wave >= 1) || !d.slots || !d.slots[0] || !WEAPONS[d.slots[0].id]) return null;
      return d;
    } catch (e) { return null; }
  }
  function clearSave() { try { localStorage.removeItem(SAVE_KEY); } catch (e) {} }
  function paintCont() {
    var d = readSave();
    contBtn.hidden = !d || state === 'paused';
    if (d) contBtn.textContent = 'Continue (wave ' + d.wave + ' cleared)';
  }
  function loadGame() {
    var d = readSave(); if (!d) return false;
    newGame();
    var k, i, g;
    wave = d.wave; wallet = +d.wallet || 0; kills = +d.kills || 0;
    for (k in upg) upg[k] = (d.upg && +d.upg[k]) || 0;
    for (k in armor) armor[k] = Math.min(4, (d.armor && +d.armor[k]) || 0);
    unlocked = Math.max(1, Math.min(3, +d.unlocked || 1));
    slots = [null, null, null];
    for (i = 0; i < 3; i++) {
      g = d.slots[i];
      if (g && WEAPONS[g.id] && i < unlocked) { slots[i] = makeGun(g.id); slots[i].tier = Math.max(1, Math.min(4, +g.tier || 1)); }
    }
    if (!slots[0]) slots[0] = makeGun('glock');
    special = null; sel = 0; lastSel = 0;
    if (d.bar && d.bar.length) for (i = 0; i < BLD.length; i++) {
      var bb = BLD[i].bar, pl = +d.bar[i];
      if (pl >= 0 && pl <= bb.max) { bb.planks = Math.floor(pl); bb.acc = 0; bb.rt = 0; }
    }
    zombies = []; bullets = []; parts = []; fx = []; coins = []; pickups = []; queue = []; ebullets = []; bolts = [];
    player = freshPlayer();
    player.hp = Math.max(1,Math.min(maxHpNow(), +d.hp || maxHpNow()));
    hideOverlay();
    rollCards();
    phase = 'grace'; graceT = TUNE.grace; state = 'play';
    showBanner('Wave ' + wave + ' cleared', 'Next wave in ' + TUNE.grace + 's · shop is open any time', 2.6);
    return true;
  }

  // ---------- overlay ----------
  function showOverlay(title, html, btn) {
    ovTitle.textContent = title; ovText.innerHTML = html; goBtn.textContent = btn;
    ov.hidden = false; paintCont();
    try { goBtn.focus({ preventScroll: true }); } catch (e) {}
  }
  function hideOverlay() { ov.hidden = true; }
  function pauseGame() {
    if (state !== 'play') return;
    state = 'paused'; joy.active = false; joy.x = joy.y = 0;
    showOverlay('Paused', 'Wave <b>' + wave + '</b> · <b>' + kills + '</b> kills. Take a breath.', 'Resume');
  }
  goBtn.addEventListener('click', function () {
    ensureAudio();
    if (state === 'ready' || state === 'over') newGame();
    else if (state === 'paused') { state = 'play'; hideOverlay(); }
    tone(300, 200, 0.08, 'square', 0.05);
  });
  pauseBtn.addEventListener('click', function () { ensureAudio(); pauseGame(); });
  contBtn.addEventListener('click', function () {
    ensureAudio();
    if (state === 'ready' || state === 'over') { loadGame(); tone(300, 200, 0.08, 'square', 0.05); }
  });
  muteBtn.addEventListener('click', function () {
    muted = !muted; paintMute(); ensureAudio();
    try { localStorage.setItem('zs-muted', muted ? '1' : '0'); } catch (e) {}
    tone(500, 400, 0.06, 'square', 0.05);
  });
  document.addEventListener('visibilitychange', function () { if (document.hidden) pauseGame(); });

  // ---------- weapon swap ----------
  function swapWeapon() {
    if (state !== 'play') return;
    var order = [], i;
    for (i = 0; i < unlocked; i++) if (slots[i]) order.push(i);
    if (special) order.push(3);
    if (order.length < 2) return;
    var k = order.indexOf(sel);
    setSel(order[(k + 1) % order.length]);
    tone(420, 620, 0.06, 'square', 0.05);
  }
  swapBtn.addEventListener('click', function () { ensureAudio(); swapWeapon(); });

  // find another gun with ammo when the current one is completely dry
  function autoSwitch() {
    var order = [lastSel, 0, 1, 2], i, k;
    for (i = 0; i < order.length; i++) {
      k = order[i];
      if (k !== sel && k < unlocked && slots[k] && (slots[k].mag > 0 || slots[k].res > 0)) { setSel(k); tone(420, 620, 0.06, 'square', 0.05); return true; }
    }
    return false;
  }

  // ---------- shop ----------
  function upgCost(id) { return Math.round(UPG[id].base * (1 + 0.4 * upg[id])); }
  function gunUpCost(s) { var w = WEAPONS[s.id]; return Math.max(50, Math.round((w.price || w.upv || 0) * 0.3)) * s.tier; }
  function ownsGun(id) { for (var i = 0; i < 3; i++) if (slots[i] && slots[i].id === id) return true; return false; }
  function fmt(n) { return n < 10 ? n.toFixed(1) : String(Math.round(n)); }
  function ammoTxt(d) { return d.noRes ? gunMag(d) + ' shots' : d.mag + ' | ' + (d.res === Infinity ? '∞' : d.res); }

  // the three upgrade cards are rolled once per wave, so reopening the shop never rerolls them
  function rollCards() {
    var ids = Object.keys(UPG), i, j, t;
    for (i = ids.length - 1; i > 0; i--) { j = Math.floor(Math.random() * (i + 1)); t = ids[i]; ids[i] = ids[j]; ids[j] = t; }
    cards = [{ id: ids[0], bought: false }, { id: ids[1], bought: false }, { id: ids[2], bought: false }];
  }

  // the shop can be opened any time during play; the game pauses while it is open
  var shopBtn = $('shopBtn');
  function openShop() {
    state = 'shop'; joy.active = false; joy.x = joy.y = 0;
    banner.hidden = true; bannerTimer = 0;
    if (!cards.length) rollCards();
    shopTab = 'upg'; pendingGun = null;
    shopTitle.textContent = phase === 'grace' ? 'Wave ' + wave + ' cleared' : 'Shop · wave ' + wave;
    shop.hidden = false;
    renderShop();
    panel.scrollTop = 0;
  }

  function buyBtn(act, id, price, enabled, cls) {
    return '<button class="buy' + (cls ? ' ' + cls : '') + '" type="button" data-act="' + act + '" data-id="' + id + '"' + (enabled ? '' : ' disabled') + '><i class="coin"></i>' + price + '</button>';
  }
  function card(name, lv, desc, btn, col) {
    return '<div class="card"' + (col ? ' style="border-left:4px solid ' + col + '"' : '') + '><div class="t"><div class="n"' + (col ? ' style="color:' + col + '"' : '') + '>' + name + (lv || '') + '</div><div class="d">' + desc + '</div></div>' + btn + '</div>';
  }
  function doneBtn(label) { return '<button class="buy alt" type="button" disabled>' + label + '</button>'; }
  function lvTag(s) { return '<span class="lv">' + s + '</span>'; }
  function gunLine(id, tier) {
    var st = wstats({ id: id, tier: tier || 1 }, true), d = st.d;
    return fmt(st.dmg) + (d.pellets > 1 ? '×' + d.pellets : '') + ' dmg · ' + st.rate.toFixed(1) + '/s · ' + ammoTxt(d);
  }

  function renderShop() {
    var h = '', i, id, s, d, c, p, t;
    purseEl.textContent = Math.floor(wallet);
    sstats.textContent = 'Damage +' + (upg.dmg * 10) + '% · Health ' + Math.round(player.hp) + '/' + Math.round(maxHpNow()) + ' · Speed ' + Math.round(spdNow()) + ' · Armour H' + armor.head + ' B' + armor.body + ' L' + armor.legs;
    for (id in tabEls) tabEls[id].setAttribute('aria-selected', shopTab === id ? 'true' : 'false');

    if (shopTab === 'upg') {
      h += '<div class="sec">Pick any of these three</div>';
      for (i = 0; i < cards.length; i++) {
        c = cards[i]; id = c.id;
        h += card(UPG[id].name, upg[id] > 0 ? lvTag('Lv ' + upg[id]) : '', UPG[id].desc,
          c.bought ? doneBtn('Bought') : buyBtn('upg', id, upgCost(id), wallet >= upgCost(id)));
      }
    } else if (shopTab === 'guns') {
      h += '<div class="sec">Your guns</div>';
      for (i = 0; i < 3; i++) {
        if (i >= unlocked) continue;
        s = slots[i];
        if (!s) { h += card('Empty slot', '', 'Buy a gun below to fill it.', ''); continue; }
        st = wstats(s, true);
        h += card(WEAPONS[s.id].name, lvTag('Mk ' + ROMAN[s.tier]).replace('class="lv"', 'class="lv tier' + s.tier + '"' + (s.tier >= 4 ? ' style="color:' + RAR[5] + '"' : '')),
          fmt(st.dmg) + (st.d.pellets > 1 ? '×' + st.d.pellets : '') + ' dmg · ' + st.rate.toFixed(1) + '/s · ' + ammoTxt(st.d),
          s.tier >= 4 ? doneBtn('Max') : '<button class="buy" type="button" data-act="gunup" data-id="' + i + '"' + (wallet >= gunUpCost(s) ? '' : ' disabled') + '>Mk ' + ROMAN[s.tier + 1] + ' · ' + gunUpCost(s) + '</button>', rarCol(WEAPONS[s.id]));
      }
      if (unlocked < 3) {
        h += '<div class="sec">Gun slots</div>';
        h += card('Gun slot ' + (unlocked + 1), '', 'Carry one more gun. Swap with the button bottom-right.', buyBtn('slot', unlocked, SLOT_COST[unlocked], wallet >= SLOT_COST[unlocked]));
      }
      h += '<div class="sec">Guns for sale</div>';
      if (pendingGun) {
        h += '<div class="warn">No free slot. Replace which gun with the ' + WEAPONS[pendingGun].name + '? The old gun and its tier are lost.<div class="acts">';
        for (i = 0; i < unlocked; i++) if (slots[i]) h += '<button class="buy alt" type="button" data-act="replace" data-id="' + i + '">' + WEAPONS[slots[i].id].name + '</button>';
        h += '<button class="buy alt" type="button" data-act="cancel" data-id="0">Cancel</button></div></div>';
      } else if (unlocked === 1) {
        h += '<div class="note">Tip: buy a gun slot first or a new gun will replace your Glock.</div>';
      }
      var any = false;
      for (i = 0; i < SHOP_GUNS.length; i++) {
        id = SHOP_GUNS[i]; d = WEAPONS[id];
        if (ownsGun(id)) continue;
        any = true;
        h += card(d.name, '<span class="cls">' + CLS[d.cls].label + '</span>', gunLine(id), buyBtn('buygun', id, d.price, wallet >= d.price), rarCol(d));
      }
      if (!any) h += '<div class="note">You own every gun.</div>';
    } else {
      h += '<div class="sec">Armour</div>';
      for (i = 0; i < ARM_PARTS.length; i++) {
        p = ARM_PARTS[i]; t = armor[p]; d = ARM[p];
        var worn = t > 0 ? d.names[t - 1] : 'None';
        var now = t > 0 ? d.eff(d.val[t - 1]) : 'No bonus yet';
        var nextTxt = t < 4 ? ' Next: ' + d.eff(d.val[t]) + '.' : '';
        h += card(d.label + ': ' + worn, '<span class="lv tier' + t + '">Tier ' + t + '/4</span>', now + '.' + nextTxt,
          t >= 4 ? doneBtn('Max') : '<button class="buy" type="button" data-act="armour" data-id="' + p + '"' + (wallet >= d.cost[t] ? '' : ' disabled') + '>' + d.names[t] + ' · ' + d.cost[t] + '</button>');
      }
      h += '<div class="sec">Healing</div>';
      for (i = 0; i < HEALS.length; i++) {
        h += card(HEALS[i].name, '', HEALS[i].desc, buyBtn('heal', i, HEALS[i].price, wallet >= HEALS[i].price && player.hp < maxHpNow() - 0.5));
      }
    }
    panel.innerHTML = h;
  }

  function shopAct(a, id) {
    var i, s, cost, w, c, t;
    if (a === 'upg') {
      for (i = 0; i < cards.length; i++) if (cards[i].id === id) c = cards[i];
      if (!c || c.bought) return;
      cost = upgCost(id); if (wallet < cost) return;
      wallet -= cost; c.bought = true; upg[id]++;
      if (id === 'hp') player.hp += TUNE.hpBase * 0.1;
    } else if (a === 'gunup') {
      s = slots[+id]; if (!s || s.tier >= 4) return;
      cost = gunUpCost(s); if (wallet < cost) return;
      wallet -= cost; s.tier++;
    } else if (a === 'slot') {
      if (unlocked >= 3 || +id !== unlocked) return;
      cost = SLOT_COST[unlocked]; if (wallet < cost) return;
      wallet -= cost; unlocked++;
    } else if (a === 'buygun') {
      w = WEAPONS[id]; if (!w || w.price <= 0 || wallet < w.price || ownsGun(id)) return;
      var empty = -1;
      for (i = 0; i < unlocked; i++) if (!slots[i]) { empty = i; break; }
      if (empty >= 0) { wallet -= w.price; slots[empty] = makeGun(id); if (sel !== 3) setSel(empty); }
      else { pendingGun = id; }
    } else if (a === 'replace') {
      w = pendingGun ? WEAPONS[pendingGun] : null; i = +id;
      if (w && i < unlocked && slots[i] && wallet >= w.price) { wallet -= w.price; slots[i] = makeGun(pendingGun); if (sel === i) player.fireCd = 0.12; }
      pendingGun = null;
    } else if (a === 'cancel') {
      pendingGun = null;
    } else if (a === 'armour') {
      if (!ARM[id]) return;
      t = armor[id]; if (t >= 4) return;
      cost = ARM[id].cost[t]; if (wallet < cost) return;
      wallet -= cost; armor[id] = t + 1;
      if (id === 'body') player.hp += ARM.body.val[t] - (t > 0 ? ARM.body.val[t - 1] : 0);
    } else if (a === 'heal') {
      var it = HEALS[+id]; if (!it || wallet < it.price || player.hp >= maxHpNow() - 0.5) return;
      wallet -= it.price;
      player.hp = it.full ? maxHpNow() : Math.min(maxHpNow(), player.hp + it.hp);
    } else { return; }
    tone(700, 1100, 0.07, 'square', 0.05);
    renderShop();
    saveGame();
  }
  panel.addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('[data-act]') : null;
    if (!b || b.disabled) return;
    ensureAudio();
    shopAct(b.dataset.act, b.dataset.id);
  });
  tabs.addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('[data-tab]') : null;
    if (!b) return;
    shopTab = b.dataset.tab; pendingGun = null; renderShop(); panel.scrollTop = 0;
  });
  nextBtn.addEventListener('click', function () {
    if (state !== 'shop') return;
    ensureAudio();
    shop.hidden = true; state = 'play';
    tone(300, 200, 0.08, 'square', 0.05);
  });
  shopBtn.addEventListener('click', function () {
    ensureAudio();
    if (state !== 'play') return;
    openShop();
    tone(500, 700, 0.06, 'square', 0.05);

  // ---------- mystery box ----------

      ctx.fillStyle = '#e9f2ea'; ctx.fillRect(x - 8, y - 8, 16, 16);
      ctx.fillStyle = '#c43a2a'; ctx.fillRect(x - 6, y - 2, 12, 4); ctx.fillRect(x - 2, y - 6, 4, 12);
    } else {
      col = PERKS[pu.id].col;
      ctx.globalAlpha = 0.18 + 0.2 * pulse; ctx.fillStyle = col;
      ctx.beginPath(); ctx.arc(x, y, 19, 0, 6.283); ctx.fill();
      ctx.globalAlpha = 1;
      ctx.fillStyle = col; ctx.beginPath(); ctx.arc(x, y, 9, 0, 6.283); ctx.fill();
      ctx.fillStyle = '#14100d'; ctx.font = '700 11px "Barlow Condensed", Arial, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(PERKS[pu.id].letter, x, y + 0.5);
    }
  }

  function drawBarriers() {
    var i, b, k, r, seg;
    for (i = 0; i < BLD.length; i++) {
      b = BLD[i].bar; r = b;
      for (k = 0; k < b.max; k++) {
        seg = b.hz ? { x: r.x, y: r.y + r.h * k / b.max, w: r.w, h: r.h / b.max } : { x: r.x + r.w * k / b.max, y: r.y, w: r.w / b.max, h: r.h };
        if (k < b.planks) {
          ctx.fillStyle = '#6b4a2c'; ctx.fillRect(seg.x + 0.5, seg.y + 0.5, seg.w - 1, seg.h - 1);
          ctx.strokeStyle = '#2a1c10'; ctx.lineWidth = 1; ctx.strokeRect(seg.x + 0.5, seg.y + 0.5, seg.w - 1, seg.h - 1);
        } else {
          ctx.strokeStyle = 'rgba(120,90,60,0.35)'; ctx.lineWidth = 1; ctx.strokeRect(seg.x + 1, seg.y + 1, seg.w - 2, seg.h - 2);
        }
      }
    }
  }
  function drawBoxes() {
    for (var i = 0; i < boxes.length; i++) {
      var b = boxes[i];
      ctx.fillStyle = 'rgba(0,0,0,0.4)'; ctx.fillRect(b.x - 14, b.y - 9, 30, 24);
      ctx.fillStyle = '#4a3320'; ctx.fillRect(b.x - 15, b.y - 11, 30, 22);
      ctx.strokeStyle = '#f2c14e'; ctx.lineWidth = 2; ctx.strokeRect(b.x - 15, b.y - 11, 30, 22);
      ctx.fillStyle = '#f2c14e'; ctx.fillRect(b.x - 2, b.y - 11, 4, 22);
    }
  }

  // small radar: player in the middle, view radius 480 world units
  function drawMini() {
    var S = 96, R = 480, k = (S / 2) / R, c = S / 2, i, o, x, y, d;
    mmx.setTransform(mmDpr, 0, 0, mmDpr, 0, 0);
    mmx.clearRect(0, 0, S, S);
    var edge = c - 3;
    mmx.fillStyle = '#c43a2a';
    for (i = 0; i < BLD.length; i++) {
      o = BLD[i].bar; x = (o.cx - player.x) * k; y = (o.cy - player.y) * k;
      d = Math.hypot(x, y);
      mmx.globalAlpha = o.planks > 0 ? 1 : 0.4;
      if (d > edge) { x = x / d * edge; y = y / d * edge; mmx.fillRect(c + x - 2, c + y - 2, 4, 4); }
      else mmx.fillRect(c + x - Math.max(1.5, o.w * k / 2), c + y - Math.max(1.5, o.h * k / 2), Math.max(3, o.w * k), Math.max(3, o.h * k));
    }
    mmx.globalAlpha = 1;
    for (i = 0; i < zombies.length; i++) {
      o = zombies[i]; x = (o.x - player.x) * k; y = (o.y - player.y) * k;
      d = Math.hypot(x, y);
      mmx.fillStyle = o.boss ? '#ff8a2a' : '#e8402e';
      if (d > edge) { x = x / d * edge; y = y / d * edge; mmx.globalAlpha = 0.75; d = o.boss ? 2.2 : 1.2; }
      else { mmx.globalAlpha = 1; d = o.boss ? 2.2 : 1.3; }
      mmx.fillRect(c + x - d, c + y - d, d * 2, d * 2);
    }
    mmx.globalAlpha = 1;
    mmx.fillStyle = '#f2c14e';
    for (i = 0; i < boxes.length; i++) {
      x = (boxes[i].x - player.x) * k; y = (boxes[i].y - player.y) * k;
      d = Math.hypot(x, y);
      if (d > edge) { x = x / d * edge; y = y / d * edge; }
      mmx.beginPath(); mmx.arc(c + x, c + y, 2.4, 0, 6.283); mmx.fill();
    }
    mmx.fillStyle = '#ebe3d4';
    mmx.beginPath(); mmx.arc(c, c, 2.6, 0, 6.283); mmx.fill();
  }
  var mmDpr = Math.min(window.devicePixelRatio || 1, 2);
  mm.width = mm.height = Math.round(96 * mmDpr);

  function render() {
    var vw = W / zoom, vh = H / zoom;
    var sx = shake && !reduceMotion ? rnd(-shake, shake) : 0, sy = shake && !reduceMotion ? rnd(-shake, shake) : 0;
    cam.x = Math.max(0, Math.min(WORLD - vw, player.x - vw / 2 + sx));
    cam.y = Math.max(0, Math.min(WORLD - vh, player.y - vh / 2 + sy));
    var i;

    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = '#0c0a08'; ctx.fillRect(0, 0, cv.width, cv.height);
    setCam();
    ctx.drawImage(groundL.c, cam.x * GS, cam.y * GS, vw * GS, vh * GS, cam.x, cam.y, vw, vh);
    ctx.drawImage(bloodL.c, cam.x * GS, cam.y * GS, vw * GS, vh * GS, cam.x, cam.y, vw, vh);
    ctx.drawImage(bldL.c, cam.x * GS, cam.y * GS, vw * GS, vh * GS, cam.x, cam.y, vw, vh);
    drawBarriers();
    drawBoxes();

    for (i = 0; i < zombies.length; i++) {
      var z = zombies[i];
      if (z.x > cam.x - 40 && z.x < cam.x + vw + 40 && z.y > cam.y - 40 && z.y < cam.y + vh + 40) drawZombie(z);
    }
    drawPlayer();
    for (i = 0; i < parts.length; i++) {
      var p = parts[i];
      ctx.fillStyle = 'rgba(150,18,18,' + Math.min(1, p.life * 3).toFixed(2) + ')';
      ctx.fillRect(p.x, p.y, p.r, p.r);
    }

    // lighting
    lctx.setTransform(1, 0, 0, 1, 0, 0);
    lctx.globalCompositeOperation = 'source-over';
    lctx.clearRect(0, 0, lcv.width, lcv.height);
    lctx.fillStyle = 'rgba(5,4,4,0.8)';
    lctx.fillRect(0, 0, lcv.width, lcv.height);
    lctx.globalCompositeOperation = 'destination-out';
    var px = (player.x - cam.x) * K, py = (player.y - cam.y) * K, R = 320 * K * (1 + (player.flash > 0 ? 0.12 : 0));
    var lg = lctx.createRadialGradient(px, py, R * 0.08, px, py, R);
    lg.addColorStop(0, 'rgba(0,0,0,1)'); lg.addColorStop(0.5, 'rgba(0,0,0,0.82)'); lg.addColorStop(1, 'rgba(0,0,0,0)');
    lctx.fillStyle = lg; lctx.fillRect(0, 0, lcv.width, lcv.height);
    for (i = 0; i < fx.length; i += 6) {
      var lf = fx[i];
      if (lf.life > lf.max * 0.6) {
        var lx = (lf.x - cam.x) * K, ly = (lf.y - cam.y) * K, lr = 70 * K;
        var lg2 = lctx.createRadialGradient(lx, ly, 0, lx, ly, lr);
        lg2.addColorStop(0, 'rgba(0,0,0,0.6)'); lg2.addColorStop(1, 'rgba(0,0,0,0)');
        lctx.fillStyle = lg2; lctx.fillRect(lx - lr, ly - lr, lr * 2, lr * 2);
      }
    }
    lctx.globalCompositeOperation = 'source-over';
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.drawImage(lcv, 0, 0);

    // glowing things over the dark
    setCam();
    ctx.lineCap = 'round';
    for (i = 0; i < coins.length; i++) {
      var cn = coins[i];
      ctx.fillStyle = 'rgba(242,193,78,0.25)';
      ctx.beginPath(); ctx.arc(cn.x, cn.y, 7, 0, 6.283); ctx.fill();
      ctx.fillStyle = '#f2c14e';
      ctx.beginPath(); ctx.arc(cn.x, cn.y, 3.6, 0, 6.283); ctx.fill();
      ctx.fillStyle = '#fff3c4';
      ctx.beginPath(); ctx.arc(cn.x - 1, cn.y - 1, 1.2, 0, 6.283); ctx.fill();
    }
    for (i = 0; i < pickups.length; i++) drawPickup(pickups[i]);
    for (i = 0; i < boxes.length; i++) {
      var bx0 = boxes[i], bp = 0.5 + 0.5 * Math.sin(time * 4 + i);
      ctx.fillStyle = 'rgba(242,193,78,' + (0.12 + 0.12 * bp).toFixed(2) + ')'; ctx.beginPath(); ctx.arc(bx0.x, bx0.y, 30, 0, 6.283); ctx.fill();
      ctx.fillStyle = '#f2c14e'; ctx.font = '700 17px "Barlow Condensed", Arial, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('?', bx0.x, bx0.y + 1);
    }
    for (i = 0; i < BLD.length; i++) {
      var rb = BLD[i].bar;
      if (rb.planks < rb.max) {
        ctx.fillStyle = 'rgba(210,105,42,' + (0.35 + 0.25 * Math.sin(time * 5)).toFixed(2) + ')';
        ctx.fillRect(rb.x - 1, rb.y - 1, rb.w + 2, rb.h + 2);
        if (rb.rt > 0) { ctx.strokeStyle = '#f2c14e'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(rb.cx, rb.cy, 20, -1.57, -1.57 + 6.283 * rb.rt / TUNE.rebuildTime); ctx.stroke(); }
      }
    }
    for (i = 0; i < zombies.length; i++) {
      var rz = zombies[i];
      if (rz.kind === 'run' && rz.warn > 0) {
        var locked = rz.warn <= 0.4, la = locked ? 0.55 : 0.22 + 0.1 * Math.sin(time * 14);
        ctx.save(); ctx.translate(rz.x, rz.y); ctx.rotate(rz.dashA);
        ctx.fillStyle = 'rgba(255,60,40,' + la.toFixed(2) + ')';
        ctx.fillRect(0, -rz.r, 400, rz.r * 2);
        ctx.restore();
      }
    }
    for (i = 0; i < ebullets.length; i++) {
      var ee = ebullets[i];
      ctx.save(); ctx.translate(ee.x, ee.y); ctx.rotate(ee.spin);
      var rkP = ee.shape || [1, 1, 1, 1, 1, 1, 1, 1, 1], rkN = rkP.length, rkR = ee.r * 1.2, rkJ, rkA, rkX, rkY;
      ctx.beginPath();
      for (rkJ = 0; rkJ < rkN; rkJ++) {
        rkA = rkJ / rkN * 6.283; rkX = Math.cos(rkA) * rkR * rkP[rkJ]; rkY = Math.sin(rkA) * rkR * rkP[rkJ];
        if (rkJ) ctx.lineTo(rkX, rkY); else ctx.moveTo(rkX, rkY);
      }
      ctx.closePath();
      ctx.fillStyle = '#7b736a'; ctx.fill();
      ctx.strokeStyle = '#2a2420'; ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,0.14)'; ctx.beginPath(); ctx.arc(-rkR * 0.28, -rkR * 0.3, rkR * 0.38, 0, 6.283); ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,0.35)'; ctx.lineWidth = 1; ctx.beginPath();
      ctx.moveTo(rkR * 0.1, -rkR * 0.1); ctx.lineTo(rkR * 0.5, rkR * 0.35); ctx.moveTo(-rkR * 0.5, rkR * 0.2); ctx.lineTo(-rkR * 0.15, rkR * 0.5);
      ctx.stroke();
      ctx.restore();
    }
    for (i = 0; i < zombies.length; i++) {
      var q = zombies[i];
      if (q.x < cam.x - 30 || q.x > cam.x + vw + 30 || q.y < cam.y - 30 || q.y > cam.y + vh + 30) continue;
      var ca = Math.cos(q.ang), sa = Math.sin(q.ang), ex = q.x + ca * q.r * 0.55, ey = q.y + sa * q.r * 0.55, off = q.r * 0.26, er = q.r * 0.12 + 0.7;
      ctx.fillStyle = q.boss ? '#ff6a2a' : '#e8402e';
      ctx.beginPath(); ctx.arc(ex - sa * off, ey + ca * off, er, 0, 6.283); ctx.fill();
      ctx.beginPath(); ctx.arc(ex + sa * off, ey - ca * off, er, 0, 6.283); ctx.fill();
      if (q.hp < q.maxhp || q.type === 'tank' || q.boss) {
        var bw = q.boss ? 56 : q.r * 2 + 6, bh = q.boss ? 5 : 3.5, bx = q.x - bw / 2, by = q.y - q.r - 11;
        ctx.fillStyle = 'rgba(0,0,0,0.75)'; ctx.fillRect(bx - 1, by - 1, bw + 2, bh + 2);
        var fr = Math.max(0, q.hp / q.maxhp);
        ctx.fillStyle = fr > 0.5 ? '#c43a2a' : (fr > 0.25 ? '#d2692a' : '#e8c03a');
        if (q.boss) ctx.fillStyle = '#ff6a2a';
        ctx.fillRect(bx, by, bw * fr, bh);
      }
    }
    for (i = 0; i < bullets.length; i++) {
      var b = bullets[i];
      if (b.kind === 'fire') {
        var ff = Math.min(1, b.dist / b.max);
        ctx.fillStyle = 'rgba(255,140,40,' + (0.75 * (1 - ff * 0.75)).toFixed(2) + ')';
        ctx.beginPath(); ctx.arc(b.x, b.y, 3 + ff * 9, 0, 6.283); ctx.fill();
        ctx.fillStyle = 'rgba(255,225,140,' + (0.7 * (1 - ff)).toFixed(2) + ')';
        ctx.beginPath(); ctx.arc(b.x, b.y, 2 + ff * 4, 0, 6.283); ctx.fill();
      } else if (b.kind === 'ray') {
        ctx.strokeStyle = 'rgba(255,60,90,0.7)'; ctx.lineWidth = 6;
        ctx.beginPath(); ctx.moveTo(b.x - b.dx * 22, b.y - b.dy * 22); ctx.lineTo(b.x, b.y); ctx.stroke();
        ctx.fillStyle = 'rgba(255,70,90,0.35)'; ctx.beginPath(); ctx.arc(b.x, b.y, 11, 0, 6.283); ctx.fill();
        ctx.fillStyle = '#ffd0c8'; ctx.beginPath(); ctx.arc(b.x, b.y, 4.5, 0, 6.283); ctx.fill();
      } else if (b.kind === 'rocket') {
        ctx.strokeStyle = 'rgba(255,150,50,0.8)'; ctx.lineWidth = 4;
        ctx.beginPath(); ctx.moveTo(b.x - b.dx * 14, b.y - b.dy * 14); ctx.lineTo(b.x, b.y); ctx.stroke();
        ctx.fillStyle = '#2a2a2a'; ctx.beginPath(); ctx.arc(b.x, b.y, 4.5, 0, 6.283); ctx.fill();
      } else {
        ctx.strokeStyle = b.crit ? '#ffffff' : (b.explosive ? '#ff7a3a' : '#ffd089'); ctx.lineWidth = b.crit ? 3.4 : 2.2;
        var tl = b.long ? 18 : 9;
        ctx.beginPath(); ctx.moveTo(b.x - b.dx * tl, b.y - b.dy * tl); ctx.lineTo(b.x, b.y); ctx.stroke();
      }
    }
    if (player.flash > 0) {
      var md = defOf(curRef()), fx0 = player.x + Math.cos(player.ang) * (md.len + 14), fy0 = player.y + Math.sin(player.ang) * (md.len + 14);
      var fg = ctx.createRadialGradient(fx0, fy0, 0, fx0, fy0, 16);
      fg.addColorStop(0, 'rgba(255,230,160,0.95)'); fg.addColorStop(1, 'rgba(255,140,40,0)');
      ctx.fillStyle = fg; ctx.fillRect(fx0 - 16, fy0 - 16, 32, 32);
    }
    // reload bar over the player
    var rr = curRef();
    if (!isSpecialActive() && rr.reload > 0) {
      var rf = 1 - rr.reload / WEAPONS[rr.id].reload;
      ctx.fillStyle = 'rgba(0,0,0,0.7)'; ctx.fillRect(player.x - 14, player.y - 24, 28, 5);
      ctx.fillStyle = '#f2c14e'; ctx.fillRect(player.x - 13, player.y - 23, 26 * Math.max(0, Math.min(1, rf)), 3);
    }
    for (i = 0; i < bolts.length; i++) {
      var bo = bolts[i], bl = Math.max(0, bo.life / 0.16), pp, qq, jx, jy;
      for (qq = 0; qq < 2; qq++) {
        ctx.strokeStyle = qq ? 'rgba(255,255,255,' + bl.toFixed(2) + ')' : 'rgba(120,180,255,' + (0.8 * bl).toFixed(2) + ')';
        ctx.lineWidth = qq ? 1.6 : 4;
        ctx.beginPath(); ctx.moveTo(bo.pts[0].x, bo.pts[0].y);
        for (pp = 1; pp < bo.pts.length; pp++) {
          var p0 = bo.pts[pp - 1], p1 = bo.pts[pp], seg = 4, sk;
          for (sk = 1; sk <= seg; sk++) {
            jx = (Math.sin(time * 90 + pp * 7 + sk * 3.1) * 7) * (sk < seg ? 1 : 0); jy = (Math.cos(time * 80 + pp * 5 + sk * 2.3) * 7) * (sk < seg ? 1 : 0);
            ctx.lineTo(p0.x + (p1.x - p0.x) * sk / seg + jx, p0.y + (p1.y - p0.y) * sk / seg + jy);
          }
        }
        ctx.stroke();
      }
    }
    ctx.globalCompositeOperation = 'lighter';
    for (i = 0; i < fx.length; i++) {
      var e = fx[i];
      ctx.fillStyle = 'rgba(' + e.c + ',' + Math.max(0, e.life / e.max).toFixed(2) + ')';
      ctx.beginPath(); ctx.arc(e.x, e.y, e.r, 0, 6.283); ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';

    // screen space
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    var vg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.3, W / 2, H / 2, Math.hypot(W, H) * 0.62);
    vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.7)');
    ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
    var low = state === 'play' && player.hp / maxHpNow() < 0.3;
    var ha = Math.max(0, hurtFlash) * 0.9 + (low ? 0.1 + 0.07 * Math.sin(time * 6) : 0);
    if (ha > 0.01) { ctx.fillStyle = 'rgba(150,10,10,' + ha.toFixed(3) + ')'; ctx.fillRect(0, 0, W, H); }
    if (joy.active) {
      ctx.fillStyle = 'rgba(235,227,212,0.06)'; ctx.strokeStyle = 'rgba(235,227,212,0.35)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(joy.ox, joy.oy, JR, 0, 6.283); ctx.fill(); ctx.stroke();
      ctx.fillStyle = 'rgba(235,227,212,0.4)';
      ctx.beginPath(); ctx.arc(joy.ox + joy.x * JR, joy.oy + joy.y * JR, 24, 0, 6.283); ctx.fill();
    }
    if (state === 'play' || state === 'paused' || state === 'box') drawMini();
  }

  // ---------- loop ----------
  var last = performance.now(), hudT = 0;
  function loop(now) {
    var dt = (now - last) / 1000; last = now;
    if (dt > 0.05) dt = 0.05;
    if (state === 'play') update(dt);
    render();
    hudT -= dt;
    if (hudT <= 0) { hudT = 0.1; updateHud(); }
    requestAnimationFrame(loop);
  }
  updateHud();
  paintCont();
  requestAnimationFrame(loop);

})();
</script>
